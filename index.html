<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>New Korp FC League</title>
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#0a0a0a;--card:#151410;--tx:#f4efe0;--mut:#a89a6b;--ac:#f2c230;--ac2:#b8860b;--bd:#3a2f10;--bad:#e5645a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:780px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:0;color:var(--ac)}h2{font-size:16px;margin:0 0 8px;color:var(--ac)}
.sub,.hint{color:var(--mut);font-size:12px}
header{display:flex;align-items:center;gap:12px;margin-bottom:14px}
header img{width:58px;height:58px;border-radius:12px}
nav{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
button,select,input{font:inherit;color:var(--tx)}
nav button{padding:7px 13px;border-radius:999px;border:1px solid var(--bd);background:var(--card);cursor:pointer}
nav button.on{background:var(--ac);color:#111;border-color:var(--ac);font-weight:600}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px}
.stat b{display:block;font-size:22px;color:var(--ac)}
.tbl{overflow-x:auto}table{width:100%;border-collapse:collapse}
th,td{padding:7px 8px;text-align:center;border-bottom:1px solid var(--bd);white-space:nowrap}
th{font-size:12px;color:var(--mut);cursor:pointer}th:first-child,td:first-child{text-align:left}
.badge{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--bd);color:var(--ac)}
.score{font-size:20px;font-weight:700;color:var(--ac)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
@media(max-width:560px){.teams{grid-template-columns:1fr}}
ul{list-style:none;margin:4px 0 0;padding:0;font-size:13px}
li{display:flex;justify-content:space-between;gap:6px;padding:3px 0}
input,select{padding:7px 9px;border:1px solid var(--bd);border-radius:8px;background:#0e0d09}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--ac)}
.prow{display:grid;grid-template-columns:1fr 44px 44px 36px;gap:4px;margin-bottom:4px;align-items:center}
.prow input:not([type=checkbox]){width:100%;min-width:0}.prow input[type=number]{text-align:center;padding:7px 2px}
.btn{padding:9px 14px;border-radius:8px;border:0;background:var(--ac);color:#111;font-weight:600;cursor:pointer}
.ghost{background:none;border:1px solid var(--bd);color:var(--tx);font-weight:400}
.del{background:none;border:0;color:var(--bad);cursor:pointer;font-size:12px}
.empty{text-align:center;color:var(--mut);padding:24px}
.opt{display:block;width:100%;text-align:left;background:#0e0d09;border:1px solid var(--bd);border-radius:8px;padding:8px 10px;margin-top:6px;cursor:pointer;position:relative;overflow:hidden}
.opt.me{border-color:var(--ac)}.opt i{position:absolute;left:0;top:0;bottom:0;background:var(--ac2);opacity:.35}
.opt span{position:relative;display:flex;justify-content:space-between}
#toast{display:none;position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));background:var(--ac);color:#111;padding:10px 14px;border-radius:10px;font-weight:600;z-index:9;max-width:520px;margin:0 auto}
.rk{color:var(--ac);font-weight:700;margin-right:6px}
</style></head><body>

 if(isAdmin)h+='<div class="card"><h2>Create a poll</h2><div class="row" style="margin-bottom:8px;justify-content:flex-start"><select id="pk"><option value="match">Player of the Match</option><option value="week">Player of the Week</option><option value="month">Player of the Month</option></select><select id="pm"><option value="manual">Manual: I pick the players</option><option value="auto">Performance-based: top players</option></select><input id="pn" type="number" min="2" value="5" style="width:60px" title="How many top players"></div><input id="pt" placeholder="Title (optional)" style="width:100%;margin-bottom:8px"><div id="cands" style="max-height:170px;overflow:auto">'+
 (names().map(function(n){return '<label style="display:block;padding:2px 0"><input type="checkbox" class="cand" value="'+esc(n)+'"> '+esc(n)+'</label>'}).join("")||'<div class="sub">Log games first to get players.</div>')+'</div><div class="hint">Manual: tick players. Performance-based: top N by points for the match / last 7 days / last 30 days.</div><button class="btn" id="mk" style="margin-top:8px">Create poll</button> <span class="hint" id="pmsg"></span></div>';
 var ps=S.polls.slice().sort(function(a,b){return b.ts-a.ts});
 if(!ps.length)return h+'<div class="empty">No polls yet.</div>';
 return h+ps.map(function(p){var t=tally(p.id),tv=Object.keys(t).reduce(function(a,k){return a+t[k]},0),mine=(S.votes[ME&&ME.id]||{})[p.id];
 return '<div class="card"><div class="row"><h2 style="margin:0">'+esc(p.title)+'</h2><span class="badge">'+(p.open?"Open":"Closed")+'</span></div>'+
 p.candidates.map(function(n,i){var c=t[n]||0,pc=tv?Math.round(c*100/tv):0;return '<button class="opt'+(mine===n?" me":"")+'" data-p="'+esc(p.id)+'" data-i="'+i+'"'+(p.open?"":" disabled")+'><i style="width:'+pc+'%"></i><span><b>'+esc(n)+(mine===n?" ✓":"")+'</b><span>'+c+' · '+pc+'%</span></span></button>'}).join("")+
 '<div class="hint" style="margin-top:6px">'+tv+' vote'+(tv===1?"":"s")+(ME?"":" · log in to vote")+'</div>'+(isAdmin?'<div style="margin-top:6px"><button class="del" data-tg="'+esc(p.id)+'">'+(p.open?"Close poll":"Reopen")+'</button> <button class="del" data-dp="'+esc(p.id)+'">Delete</button></div>':'')+'</div>'}).join("")}
function mkPoll(){var kind=gv("pk"),mode=gv("pm"),c=[],last=S.games[0],title=gv("pt").trim()||({match:"Player of the Match",week:"Player of the Week",month:"Player of the Month"})[kind];
 if(mode==="manual")document.querySelectorAll(".cand:checked").forEach(function(x){c.push(x.value)});
 else{var list=kind==="week"?since(7):kind==="month"?since(30):apps().filter(function(e){return last&&e.gid===last.id});c=agg(list).sort(function(x,y){return y.pts-x.pts}).slice(0,+gv("pn")||5).map(function(r){return r.n})}
 if(c.length<2){$("pmsg").textContent="Need at least 2 candidates.";return}
 db.collection("polls").add({title:title,kind:kind,mode:mode,candidates:c,open:true,ts:Date.now()}).catch(function(){$("pmsg").textContent="Couldn't create poll."})}
function vote(pid,i){var p=S.polls.filter(function(x){return x.id===pid})[0];if(!p)return;if(!ME){toast("Log in (Log in tab) to vote.");return}
 sb.from("votes").upsert({poll_id:pid,user_id:ME.id,candidate:p.candidates[i]}).then(function(r){if(r.error)fail(r.error);else loadAll()})}
/* SUBMIT */
function teamOpts(ty){return TYPES[ty].teams.map(function(n,i){return '<option value="'+i+'">'+esc(n)+'</option>'}).join("")}
function stl(x){return x.g+'G '+x.a+'A '+(x.c?"CS":"")}
function submitView(){if(!ME)return '<div class="card"><h2>Submit your stats</h2><div class="sub">Log in or sign up in the <b>Log in</b> tab first. Your account name is the name your stats are logged under.</div></div>';
 var mine=S.subs.filter(function(x){return x.uid===ME.id}).sort(function(a,b){return b.ts-a.ts}),pend=S.subs.filter(function(x){return x.status==="pending"});
 var h='<div class="card"><h2>Submit your stats</h2><div class="sub">Submitting as <b>'+esc(ME.name)+'</b></div><div class="row" style="justify-content:flex-start;margin:8px 0"><input type="date" id="sd" value="'+new Date().toISOString().slice(0,10)+'"><select id="st"><option value="scrimmage">Sec 5 scrimmage</option><option value="vs">Sec 5 vs Sec 4</option></select><select id="sm">'+teamOpts("scrimmage")+'</select></div><div class="row" style="justify-content:flex-start"><label>Goals <input type="number" id="sg" min="0" value="0" style="width:60px"></label><label>Assists <input type="number" id="sa" min="0" value="0" style="width:60px"></label><label><input type="checkbox" id="sc"> Clean sheet</label></div><button class="btn" id="ss" style="margin-top:10px">Submit for approval</button> <span class="hint" id="smsg"></span></div>';
 if(mine.length)h+='<div class="card"><h2>My submissions</h2><ul>'+mine.map(function(x){return '<li><span>'+esc(fmtDate(x.date))+' · '+stl(x)+'</span><span class="badge">'+esc(x.status)+'</span></li>'}).join("")+'</ul></div>';
 if(isAdmin){var cf=S.subs.filter(function(x){return x.status==="conflict"}),ap=S.subs.filter(function(x){return x.status==="approved"});
  if(cf.length)h+='<div class="card" style="border-color:var(--ac)"><h2>Needs your decision</h2><div class="hint">These players are already in the logged game with different stats.</div><ul>'+cf.map(function(x){return '<li><span>'+esc(x.name)+' · '+esc(fmtDate(x.date))+' · submitted '+stl(x)+'</span><span><button class="btn" style="padding:3px 8px" data-rs="'+esc(x.id)+'" data-md="replace">Use submitted</button> <button class="btn ghost" style="padding:3px 8px" data-rs="'+esc(x.id)+'" data-md="add">Add on top</button> <button class="del" data-rj="'+esc(x.id)+'">Dismiss</button></span></li>'}).join("")+'</ul></div>';
  if(ap.length)h+='<div class="card"><h2>Approved, waiting for their game</h2><ul>'+ap.map(function(x){return '<li><span>'+esc(x.name)+' · '+esc(fmtDate(x.date))+' · '+esc((TYPES[x.type]||TYPES.vs).label)+' · '+stl(x)+'</span><button class="del" data-rj="'+esc(x.id)+'">Delete</button></li>'}).join("")+'</ul><div class="hint">They move into the game automatically when it is logged.</div></div>';
  h+='<div class="card"><h2>Pending approvals</h2>'+(pend.length?'<ul>'+pend.map(function(x){return '<li><span>'+esc(x.name)+' · '+esc(fmtDate(x.date))+' · '+stl(x)+'</span><span><button class="btn" style="padding:3px 10px" data-ap="'+esc(x.id)+'">Approve</button> <button class="del" data-rj="'+esc(x.id)+'">Reject</button></span></li>'}).join("")+'</ul>':'<div class="sub">Nothing pending.</div>')+'</div>'}
 return h}
function sendSub(){db.collection("submissions").add({uid:ME.id,name:ME.name,date:gv("sd"),type:gv("st"),team:+gv("sm")||0,g:+gv("sg")||0,a:+gv("sa")||0,c:$("sc").checked?1:0,status:"pending",ts:Date.now()}).then(function(){$("smsg").textContent="Submitted! Waiting for admin approval."}).catch(function(e){$("smsg").textContent="Couldn't submit: "+((e&&(e.code||e.message))||"error")})}
/* ACCOUNTS (Supabase Auth) */
function hx(u){return Array.from(u).map(function(b){return ("0"+b.toString(16)).slice(-2)}).join("")}
async function sha(t){return hx(new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t))))}
async function creds(n,p){var k=nk(n);return{email:(await sha("korp|"+k)).slice(0,40)+"@"+EMAIL_DOMAIN,password:await sha("korp-pw|"+k+"|"+p)}}
function em(e){return (e&&(e.code||e.message))||"error"}
function setMe(m){ME=m;isAdmin=!!(m&&m.admin);render()}
async function loadMe(){var ss=(await sb.auth.getSession()).data.session;if(!ss){setMe(null);return}var r=await sb.from("profiles").select("*").eq("id",ss.user.id).maybeSingle();setMe(r.data?{id:ss.user.id,name:r.data.name,admin:r.data.is_admin}:null)}
async function signUp(){var n=gv("an").trim().replace(/\s+/g," "),p=gv("ap"),m=$("amsg");
 if(!NAME_RE.test(n)){m.innerHTML='<b style="color:var(--bad)">Wrong name format.</b> Use F. Lastname, F. M. Lastname or F.-M. Lastname.';return}
 if(!p){m.textContent="Choose a password.";return}if(p!==gv("ap2")){m.textContent="Passwords don't match.";return}
 try{var c=await creds(n,p),r=await sb.auth.signUp({email:c.email,password:c.password,options:{data:{name:n}}});
  if(r.error){m.textContent=/already|registered/i.test(r.error.message)?"That name already has an account. Log in instead.":"Couldn't sign up: "+r.error.message;return}
  if(!r.data.session){m.textContent="Account created, but email confirmation is still ON in Supabase. The site owner must turn it off (see README).";return}
  await loadMe();loadAll()}catch(e){m.textContent="Couldn't sign up: "+em(e)}}
async function logIn(){var n=gv("ln").trim().replace(/\s+/g," "),m=$("lmsg");
 try{var c=await creds(n,gv("lp")),r=await sb.auth.signInWithPassword(c);if(r.error){m.textContent="Wrong name or password.";return}await loadMe();loadAll()}catch(e){m.textContent="Couldn't log in: "+em(e)}}
async function chPw(){var m=$("cmsg"),np=gv("np");if(!np){m.textContent="Enter a new password.";return}
 try{var r=await sb.auth.signInWithPassword(await creds(ME.name,gv("op")));if(r.error){m.textContent="Current password is wrong.";return}
  var u=await sb.auth.updateUser({password:(await creds(ME.name,np)).password});if(u.error){m.textContent="Couldn't change: "+u.error.message;return}toast("Password changed.")}catch(e){m.textContent="Couldn't change: "+em(e)}}
function acctView(){if(ME)return '<div class="card"><h2>👤 '+esc(ME.name)+'</h2><div class="sub">'+(isAdmin?"Admin account":"Player account")+'</div><button class="btn ghost" id="lo" style="margin-top:8px">Log out</button></div><div class="card"><h2>Change password</h2><div class="row" style="justify-content:flex-start"><input id="op" type="password" placeholder="Current password"><input id="np" type="password" placeholder="New password"><button class="btn" id="cp">Change</button></div><div class="hint" id="cmsg"></div></div>'+
  (isAdmin?'<div class="card"><h2>Accounts ('+S.accts.length+')</h2><ul>'+S.accts.map(function(a){return '<li><span>'+esc(a.name)+(a.is_admin?' <span class="badge">admin</span>':'')+'</span></li>'}).join("")+'</ul><div class="hint">To reset a forgotten password: Supabase dashboard, Authentication, Users, delete that user. They can then sign up again.</div></div>':'');
 return '<div class="card" style="border-color:var(--ac)"><b style="color:var(--ac)">⚠ IMPORTANT: your account name is also your player name. Type it exactly like this or it will not be accepted</b><ul><li><span>No middle name</span><b>F. Lastname</b></li><li><span>Middle name, no hyphen</span><b>F. M. Lastname</b></li><li><span>Middle name with a hyphen</span><b>F.-M. Lastname</b></li></ul></div>'+
 '<div class="grid"><div class="card"><h2>Log in</h2><input id="ln" placeholder="F. Lastname" style="width:100%;margin-bottom:6px"><input id="lp" type="password" placeholder="Password" style="width:100%;margin-bottom:8px"><button class="btn" id="li">Log in</button><div class="hint" id="lmsg" style="margin-top:6px"></div></div>'+
 '<div class="card"><h2>Sign up</h2><input id="an" placeholder="F. Lastname" style="width:100%;margin-bottom:6px"><input id="ap" type="password" placeholder="Choose a password (any length)" style="width:100%;margin-bottom:6px"><input id="ap2" type="password" placeholder="Repeat password" style="width:100%;margin-bottom:8px"><button class="btn" id="su">Create account</button><div class="hint" id="amsg" style="margin-top:6px"></div></div></div><div class="hint">Please do not reuse a password from anywhere important.</div>'}
/* LOG GAME */
function prow(){return '<div class="prow"><input list="pl" placeholder="Player" class="pn"><input type="number" min="0" placeholder="G" class="pg"><input type="number" min="0" placeholder="A" class="pa"><input type="checkbox" class="pc" title="Clean sheet"></div>'}
function addView(){return '<div class="card"><h2>Log a game</h2><div class="row" style="justify-content:flex-start;margin-bottom:10px"><input type="date" id="gd" value="'+new Date().toISOString().slice(0,10)+'"><select id="gt"><option value="scrimmage">Sec 5 scrimmage</option><option value="vs">Sec 5 vs Sec 4</option></select></div><datalist id="pl">'+names().map(function(n){return '<option value="'+esc(n)+'">'}).join("")+'</datalist>'+
 [0,1].map(function(i){return '<div style="margin-bottom:12px"><h2 id="t'+i+'">'+(i?"Team B":"Team A")+'</h2><div class="hint">G = goals · A = assists · tick box = clean sheet</div><div id="p'+i+'">'+prow().repeat(5)+'</div><button class="btn ghost" data-r="'+i+'">+ Player</button></div>'}).join("")+'<p class="hint">Score is added up from goals.</p><button class="btn" id="save">Save game</button> <span id="msg" class="hint"></span></div>'}
function readTeam(i){var o=[];document.querySelectorAll("#p"+i+" .prow").forEach(function(r){var n=r.querySelector(".pn").value.trim();if(n)o.push({n:n.slice(0,40),g:+r.querySelector(".pg").value||0,a:+r.querySelector(".pa").value||0,c:r.querySelector(".pc").checked?1:0})});return o}
function nk(n){return String(n).toLowerCase().replace(/\s+/g," ").trim()}
function addToTeams(teams,x){var k=nk(x.name),g=+x.g||0,a=+x.a||0,c=+x.c||0;
 for(var ti=0;ti<2;ti++)for(var pi=0;pi<teams[ti].players.length;pi++){var p=teams[ti].players[pi];if(nk(p.n)===k){
  if(!(+p.g||0)&&!(+p.a||0)&&!(+p.c||0)){p.g=g;p.a=a;p.c=c;return "merged"}
  return ((+p.g||0)===g&&(+p.a||0)===a&&(+p.c||0)===c)?"merged":"conflict"}}
 teams[+x.team===1?1:0].players.push({n:x.name,g:g,a:a,c:c});return "merged"}
function delPlayer(gid,ti,pi){var g=S.games.filter(function(x){return x.id===gid})[0];if(!g||!g.teams[ti]||!g.teams[ti].players[pi])return;var t=clone(g.teams);t[ti].players.splice(pi,1);db.doc("games/"+gid).update({teams:t}).catch(fail)}
function approve(id){var x=S.subs.filter(function(s){return s.id===id})[0];if(!x)return;var g=S.games.filter(function(g){return g.date===x.date&&g.type===x.type})[0];
 if(!g){db.doc("submissions/"+id).update({status:"approved"}).catch(fail);return}
 var t=clone(g.teams),st=addToTeams(t,x);(st==="merged"?db.doc("games/"+g.id).update({teams:t}):Promise.resolve()).then(function(){return db.doc("submissions/"+id).update({status:st,v:2})}).then(function(){if(st==="conflict")toast(x.name+" is already in that game with different stats. Choose what to do in Submit stats.")}).catch(fail)}
async function mergeAll(){var subs=(await db.collection("submissions").get()).docs.map(function(d){return Object.assign({id:d.id},d.data())}).filter(function(x){return x.status!=="merged"||!x.v}),gs=(await db.collection("games").get()).docs.map(function(d){return Object.assign({id:d.id},d.data())}),n=0,c=0,used={};
 for(var k=0;k<gs.length;k++){var g=gs[k],hit=subs.filter(function(x){return !used[x.id]&&x.date===g.date&&x.type===g.type});if(!hit.length||!g.teams)continue;var t=clone(g.teams),ch=false,res=hit.map(function(x){used[x.id]=1;var r=addToTeams(t,x);if(r==="merged")ch=true;return r});
  if(ch)await db.doc("games/"+g.id).update({teams:t});for(var m=0;m<hit.length;m++){await db.doc("submissions/"+hit[m].id).update({status:res[m],v:2});if(res[m]==="merged")n++;else c++}}
 toast(n+" merged"+(c?", "+c+" need your decision (see Submit stats)":"")+(n+c?".":". Nothing matched a logged game's date and game type."))}
function resolve(id,mode){var x=S.subs.filter(function(s){return s.id===id})[0],g=x&&S.games.filter(function(g){return g.date===x.date&&g.type===x.type})[0];if(!g){toast("No logged game found for that date and game type.");return}
 var t=clone(g.teams),k=nk(x.name),done=false;t.forEach(function(tm){tm.players.forEach(function(p){if(!done&&nk(p.n)===k){done=true;if(mode==="add"){p.g=(+p.g||0)+(+x.g||0);p.a=(+p.a||0)+(+x.a||0);p.c=((+p.c||0)||(+x.c||0))?1:0}else{p.g=+x.g||0;p.a=+x.a||0;p.c=+x.c||0}}})});if(!done)addToTeams(t,x);
 db.doc("games/"+g.id).update({teams:t}).then(function(){return db.doc("submissions/"+id).update({status:"merged",v:2})}).catch(fail)}
function saveGame(){var ty=gv("gt"),T=TYPES[ty].teams,a=readTeam(0),b=readTeam(1);if(!a.length||!b.length){$("msg").textContent="Add at least one player per team.";return}
 $("save").disabled=true;var teams=[{name:T[0],players:a},{name:T[1],players:b}],date=gv("gd"),subs=[];db.collection("submissions").get().then(function(sn){subs=sn.docs.map(function(d){return Object.assign({id:d.id},d.data())}).filter(function(x){return x.status!=="merged"&&x.date===date&&x.type===ty});subs.forEach(function(x){x._r=addToTeams(teams,x)});return db.collection("games").add({date:date,type:ty,ts:Date.now(),teams:teams})}).then(function(){subs.forEach(function(x){db.doc("submissions/"+x.id).update({status:x._r,v:2}).catch(fail)});if(subs.some(function(x){return x._r==="conflict"}))toast("Some submitted stats conflict with players you logged. See Submit stats.");tab="games";render()}).catch(function(e){$("save").disabled=false;$("msg").textContent="Couldn't save: "+((e&&(e.code||e.message))||"error")})}
/* RENDER */
function render(){nav();var v=$("view");v.onclick=null;
 if(tab==="games"){v.innerHTML=gamesView();v.onclick=function(e){var b=e.target.closest("button");if(!b||!db)return;var d=b.getAttribute("data-del"),x=b.getAttribute("data-x");
  if(d)arm(b,function(){db.doc("games/"+d).delete().catch(fail)});
  else if(x)arm(b,function(){delPlayer(x,+b.getAttribute("data-tm"),+b.getAttribute("data-pi"))});
  else if(b.id==="mg")mergeAll().catch(fail)}}
 else if(tab==="leaders"){v.innerHTML=leadersView();$("flt").value=filter;$("flt").onchange=function(){filter=gv("flt");$("tbl").innerHTML=tableHTML()};$("sq").oninput=function(){q=gv("sq");$("tbl").innerHTML=tableHTML()};
  v.onclick=function(e){var s=e.target.getAttribute("data-s");if(s){sortKey=s;$("tbl").innerHTML=tableHTML()}}}
 else if(tab==="news")v.innerHTML=newsView();
 else if(tab==="polls"){v.innerHTML=pollsView();if($("mk"))$("mk").onclick=mkPoll;
  v.onclick=function(e){var t=e.target.closest("[data-p],[data-tg],[data-dp]");if(!t||!db)return;
   if(t.hasAttribute("data-p"))vote(t.getAttribute("data-p"),+t.getAttribute("data-i"));
   else if(t.hasAttribute("data-tg")){var id=t.getAttribute("data-tg"),p=S.polls.filter(function(x){return x.id===id})[0];db.doc("polls/"+id).update({open:!p.open}).catch(fail)}
   else arm(t,function(){db.doc("polls/"+t.getAttribute("data-dp")).delete().catch(fail)})}}
 else if(tab==="submit"){v.innerHTML=submitView();if($("ss")){$("ss").onclick=sendSub;$("st").onchange=function(){$("sm").innerHTML=teamOpts(gv("st"))}}
  v.onclick=function(e){var a=e.target.getAttribute("data-ap"),r=e.target.getAttribute("data-rj");if(a)approve(a);if(e.target.getAttribute("data-rs"))resolve(e.target.getAttribute("data-rs"),e.target.getAttribute("data-md"));if(r)db.doc("submissions/"+r).delete().catch(fail)}}
 else if(tab==="acct"){v.innerHTML=acctView();if($("li")){$("li").onclick=logIn;$("su").onclick=signUp}if($("lo"))$("lo").onclick=function(){sb.auth.signOut().then(function(){setMe(null);loadAll()})};if($("cp"))$("cp").onclick=chPw;
  }
 else if(isAdmin){v.innerHTML=addView();$("gt").onchange=function(){var T=TYPES[gv("gt")].teams;$("t0").textContent=T[0];$("t1").textContent=T[1]};
  $("save").onclick=saveGame;v.onclick=function(e){var r=e.target.getAttribute("data-r");if(r!==null)$("p"+r).insertAdjacentHTML("beforeend",prow())}}
 else{tab="games";render()}}
function rerender(){var a=document.activeElement;if(a&&/INPUT|SELECT/.test(a.tagName)&&tab!=="games"&&tab!=="news")return;render()}
function chk(r){if(r.error)throw{code:r.error.code||"error",message:r.error.message};return r}
var db={collection:function(c){return{
 add:async function(o){chk(await sb.from(c).insert(o));await loadAll()},
 get:async function(){var r=chk(await sb.from(c).select("*"));return{docs:r.data.map(function(x){return{id:x.id,data:function(){return x}}})}}}},
 doc:function(p){var a=p.split("/"),c=a[0],id=a[1];return{
 update:async function(o){chk(await sb.from(c).update(o).eq("id",id));await loadAll()},
 delete:async function(){chk(await sb.from(c).delete().eq("id",id));await loadAll()}}}};
async function loadAll(){if(!sb)return;try{var r=await Promise.all([sb.from("games").select("*"),sb.from("polls").select("*"),sb.from("submissions").select("*"),sb.from("votes").select("*"),sb.from("profiles").select("*")]);
 for(var k=0;k<r.length;k++)if(r[k].error)throw r[k].error;
 S.games=r[0].data.filter(function(g){return g.teams&&g.teams.length===2}).sort(function(a,b){return (b.date||"").localeCompare(a.date||"")||(b.ts||0)-(a.ts||0)});
 S.polls=r[1].data;S.subs=r[2].data;S.votes={};r[3].data.forEach(function(v){(S.votes[v.user_id]=S.votes[v.user_id]||{})[v.poll_id]=v.candidate});
 S.accts=r[4].data.sort(function(a,b){return (a.name||"").localeCompare(b.name||"")});loaded=true;rerender()}catch(e){loaded=true;rerender();toast("Couldn't load data: "+em(e))}}
render();
(async function(){
 if(!sb){loaded=true;$("view").innerHTML='<div class="card"><h2>Almost there</h2><div class="sub">Add your Supabase URL and key at the top of index.html (see README.md).</div></div>';return}
 try{await loadMe();await loadAll();setInterval(function(){if(!document.hidden&&["games","leaders","news","polls"].indexOf(tab)>=0)loadAll()},30000)}catch(e){loaded=true;render();toast("Couldn't connect: "+em(e))}})();
</script></body></html>
