<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>New Korp FC League</title>
<style>
:root{color-scheme:dark;--bg:#0a0a0a;--card:#151410;--tx:#f4efe0;--mut:#a89a6b;--ac:#f2c230;--ac2:#b8860b;--bd:#3a2f10;--bad:#e5645a}
*,*:before,*:after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.wrap{max-width:820px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:0;color:var(--ac)}h2{font-size:16px;margin:0 0 8px;color:var(--ac)}
.sub,.hint{color:var(--mut);font-size:12px}
header{display:flex;align-items:center;gap:12px;margin-bottom:14px}
header img{width:58px;height:58px;border-radius:12px}
nav{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
button,select,input{font:inherit;color:var(--tx)}
nav button,.seg button{padding:7px 13px;border-radius:999px;border:1px solid var(--bd);background:var(--card);cursor:pointer}
nav button.on,.seg button.on{background:var(--ac);color:#111;border-color:var(--ac);font-weight:600}
.seg{display:flex;gap:6px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px}
.stat b{display:block;font-size:22px;color:var(--ac)}
.tbl{overflow-x:auto}table{width:100%;border-collapse:collapse}
th,td{padding:7px 8px;text-align:center;border-bottom:1px solid var(--bd);white-space:nowrap}
th{font-size:12px;color:var(--mut);cursor:pointer}th:first-child,td:first-child{text-align:left}
.badge{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--bd);color:var(--ac)}
.score{font-size:20px;font-weight:700;color:var(--ac)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
@media(max-width:560px){.teams{grid-template-columns:1fr}}
ul{list-style:none;margin:4px 0 0;padding:0;font-size:13px}
li{display:flex;justify-content:space-between;gap:6px;padding:3px 0}
input,select{padding:7px 9px;border:1px solid var(--bd);border-radius:8px;background:#0e0d09}
input[type=checkbox],input[type=radio]{width:18px;height:18px;accent-color:var(--ac)}
.prow{display:grid;grid-template-columns:1fr 38px 38px 38px 24px 24px;gap:4px;margin-bottom:4px;align-items:center}
.prow.hd{font-size:11px;color:var(--mut);text-align:center}.prow.hd span:first-child{text-align:left}
.prow input:not([type=checkbox]):not([type=radio]){width:100%;min-width:0}.prow input[type=number]{text-align:center;padding:7px 2px}
.ev{display:grid;grid-template-columns:54px 1fr 1fr auto auto;gap:4px;margin-bottom:4px;align-items:center}
.ev input:not([type=checkbox]){width:100%;min-width:0}
.btn{padding:9px 14px;border-radius:8px;border:0;background:var(--ac);color:#111;font-weight:600;cursor:pointer}
.ghost{background:none;border:1px solid var(--bd);color:var(--tx);font-weight:400}
.del{background:none;border:0;color:var(--bad);cursor:pointer;font-size:12px}
.empty{text-align:center;color:var(--mut);padding:24px}
.rk{color:var(--ac);font-weight:700;margin-right:6px}
a.pl{color:var(--tx);cursor:pointer;text-decoration:underline dotted var(--ac2)}
.chip{display:inline-block;margin:0 6px 6px 0;padding:5px 11px;border:1px solid var(--bd);border-radius:999px;background:var(--card)}
.tb{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0}.tb button{padding:5px 10px;border:1px solid var(--bd);border-radius:6px;background:var(--card);cursor:pointer}
.ed{min-height:130px;border:1px solid var(--bd);border-radius:8px;padding:10px;background:#0e0d09;outline:none}
.post{overflow-wrap:anywhere}.post ul{list-style:disc;padding-left:22px}.post ol{padding-left:22px}.post li{display:list-item}.post h3{color:var(--ac);margin:8px 0 4px}
#toast{display:none;position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));background:var(--ac);color:#111;padding:10px 14px;border-radius:10px;font-weight:600;z-index:9;max-width:520px;margin:0 auto}
</style></head><body>
