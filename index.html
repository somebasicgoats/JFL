<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>New Korp FC League</title>
<style>
:root{color-scheme:dark;--bg:#07070a;--card:#14110a;--card2:#1c170b;--tx:#f6f1e1;--mut:#a89a6b;--ac:#f2c230;--ac2:#b8860b;--ac3:#ffe08a;--bd:#3a2f10;--bad:#e5645a;--ok:#4cc38a}
*,*:before,*:after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:radial-gradient(900px 520px at 85% -8%,rgba(242,194,48,.14),transparent 62%),radial-gradient(700px 480px at -8% 108%,rgba(184,134,11,.16),transparent 60%),var(--bg);background-attachment:fixed;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(115deg,rgba(255,224,138,.018) 0 2px,transparent 2px 26px)}
.app{position:relative;display:grid;grid-template-columns:232px minmax(0,1fr);gap:18px;max-width:1120px;margin:0 auto;padding:16px}
aside{position:sticky;top:16px;align-self:start;display:flex;flex-direction:column;gap:14px;padding:14px;border-radius:18px;border:1px solid var(--bd);background:linear-gradient(180deg,rgba(28,23,11,.94),rgba(16,13,7,.94));box-shadow:0 12px 40px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,224,138,.08);max-height:calc(100vh - 32px);overflow:auto}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:52px;height:52px;border-radius:14px;box-shadow:0 0 0 1px var(--bd),0 6px 18px rgba(242,194,48,.18)}
h1{font-size:16px;line-height:1.15;margin:0;background:linear-gradient(90deg,var(--ac3),var(--ac));-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:15px;margin:0 0 10px;color:var(--ac3);display:flex;align-items:center;gap:8px;letter-spacing:.2px}
h2:before{content:"";flex:none;width:4px;height:15px;border-radius:2px;background:linear-gradient(var(--ac3),var(--ac2))}
.sub,.hint{color:var(--mut);font-size:12px}
.ic{vertical-align:-3px;flex:none}
nav{display:flex;flex-direction:column;gap:4px}
nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 12px;border-radius:12px;border:1px solid transparent;background:transparent;color:var(--tx);cursor:pointer;transition:.18s}
nav button:hover{background:rgba(242,194,48,.08);border-color:var(--bd)}
nav button.on{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#17120a;font-weight:700;box-shadow:0 4px 18px rgba(242,194,48,.28)}
main{min-width:0;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
button,select,input{font:inherit;color:var(--tx)}
.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 8px 28px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,224,138,.06)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.grid .card{margin-bottom:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:10px;margin-bottom:14px}
.stat{position:relative;overflow:hidden;background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--bd);border-radius:14px;padding:12px}
.stat:after{content:"";position:absolute;right:-18px;top:-18px;width:56px;height:56px;border-radius:50%;background:radial-gradient(circle,rgba(242,194,48,.18),transparent 70%)}
.stat b{display:block;font-size:24px;line-height:1.1;color:var(--ac)}
.tbl{overflow-x:auto}table{width:100%;border-collapse:collapse}
th,td{padding:8px 8px;text-align:center;border-bottom:1px solid rgba(58,47,16,.7);white-space:nowrap}
tr:hover td{background:rgba(242,194,48,.04)}
th{font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--mut);cursor:pointer}
th:first-child,td:first-child{text-align:left}
.badge{display:inline-block;font-size:11px;padding:2px 9px;border-radius:999px;background:rgba(242,194,48,.12);border:1px solid var(--bd);color:var(--ac3)}
.pp{display:inline-block;font-size:10px;font-weight:700;padding:1px 6px;border-radius:6px;color:#fff;margin-left:6px;vertical-align:1px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.sb{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;margin:12px 0 6px}
.sb .tm{display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:600;text-align:center}
.crest{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;color:#17120a;background:linear-gradient(135deg,var(--ac3),var(--ac) 50%,var(--ac2));box-shadow:0 4px 14px rgba(242,194,48,.3),inset 0 -3px 6px rgba(0,0,0,.18)}
.crest.b{background:linear-gradient(135deg,#d7dde5,#9aa6b4);box-shadow:0 4px 14px rgba(0,0,0,.4)}
.score{font-size:34px;font-weight:800;letter-spacing:2px;background:linear-gradient(180deg,var(--ac3),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.motm{display:flex;justify-content:center;margin:2px 0 4px}
.motm span{display:inline-flex;align-items:center;gap:6px;padding:3px 12px;border-radius:999px;background:rgba(242,194,48,.12);border:1px solid var(--ac2);color:var(--ac3);font-size:12px}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:10px}
@media(max-width:560px){.teams{grid-template-columns:1fr}}
ul{list-style:none;margin:4px 0 0;padding:0;font-size:13px}
li{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:4px 0;border-bottom:1px dashed rgba(58,47,16,.55)}
li:last-child{border-bottom:0}
.tlw{position:relative;margin-top:10px;padding-left:18px}
.tlw:before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:linear-gradient(var(--ac),rgba(242,194,48,.1))}
.tlw li{position:relative}.tlw li:before{content:"";position:absolute;left:-18px;top:11px;width:10px;height:10px;border-radius:50%;background:var(--ac);box-shadow:0 0 0 3px rgba(242,194,48,.2)}
.tlw li.og:before{background:var(--bad);box-shadow:0 0 0 3px rgba(229,100,90,.2)}
input,select{padding:8px 10px;border:1px solid var(--bd);border-radius:10px;background:#0d0b06;transition:border-color .15s}
input:focus,select:focus{outline:none;border-color:var(--ac)}
input[type=checkbox],input[type=radio]{width:18px;height:18px;padding:0;accent-color:var(--ac)}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:10px;border:0;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#17120a;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(242,194,48,.22);transition:.15s}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn:disabled{opacity:.5;cursor:default;transform:none}
.ghost{background:transparent;border:1px solid var(--bd);color:var(--tx);font-weight:500;box-shadow:none}
.ghost:hover{border-color:var(--ac);background:rgba(242,194,48,.06)}
.seg{display:inline-flex;padding:3px;border-radius:999px;border:1px solid var(--bd);background:#0d0b06;gap:2px}
.seg button{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;border:0;background:transparent;cursor:pointer}
.seg button.on{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#17120a;font-weight:700}
.del{display:inline-flex;align-items:center;gap:4px;background:none;border:0;color:var(--bad);cursor:pointer;font-size:12px}
.sbox{position:relative}.sbox .ic{position:absolute;left:11px;top:50%;margin-top:-8px;color:var(--mut)}.sbox input{width:100%;padding-left:34px}
.empty{text-align:center;color:var(--mut);padding:28px}
.rk{color:var(--ac);font-weight:800;margin-right:8px}
a.pl{color:var(--tx);cursor:pointer;text-decoration:underline dotted var(--ac2)}a.pl:hover{color:var(--ac3)}
.chip{display:inline-flex;align-items:center;gap:8px;margin:0 8px 8px 0;padding:6px 13px;border:1px solid var(--bd);border-left-width:4px;border-radius:12px;background:linear-gradient(180deg,var(--card2),var(--card));text-decoration:none;transition:.15s}
.chip:hover{transform:translateY(-2px);border-color:var(--ac)}.chip small{color:var(--mut)}
.prow{display:grid;grid-template-columns:1fr 38px 38px 38px 24px 24px;gap:4px;margin-bottom:4px;align-items:center}
.prow.hd{font-size:11px;color:var(--mut);text-align:center}.prow.hd span:first-child{text-align:left}
.prow input:not([type=checkbox]):not([type=radio]),.prow select{width:100%;min-width:0}.prow input[type=number]{text-align:center;padding:8px 2px}
.pcell{display:block;min-width:0}
.ev{display:grid;grid-template-columns:54px 1fr 1fr auto auto;gap:4px;margin-bottom:4px;align-items:center}
.ev input:not([type=checkbox]),.ev select{width:100%;min-width:0}
.tb{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0}.tb button{display:inline-grid;place-items:center;min-width:34px;height:32px;border:1px solid var(--bd);border-radius:8px;background:var(--card);cursor:pointer}
.ed{min-height:130px;border:1px solid var(--bd);border-radius:10px;padding:10px;background:#0d0b06;outline:none}
.post{overflow-wrap:anywhere}.post ul{list-style:disc;padding-left:22px}.post ol{padding-left:22px}.post li{display:list-item;border:0}.post h3{color:var(--ac);margin:8px 0 4px}
.fld{display:grid;gap:3px;font-size:12px;color:var(--mut)}.fld input,.fld select{width:100%}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:12px}
.pchips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.pchip{padding:5px 12px;border-radius:999px;border:1px solid var(--pc);color:var(--pc);background:transparent;cursor:pointer;font-weight:700;font-size:12px}
.pchip.sel{background:var(--pc);color:#fff}
.prof{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:start;margin-bottom:14px}
@media(max-width:620px){.prof{grid-template-columns:1fr;justify-items:center}}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px 10px;justify-items:center}
.fcw{display:inline-block;filter:drop-shadow(0 8px 14px rgba(0,0,0,.55));transition:transform .2s;cursor:pointer}
.fcw:hover{transform:translateY(-4px) scale(1.03)}
.fc{position:relative;width:148px;height:212px;padding:12px 10px;display:flex;flex-direction:column;align-items:center;color:#2a2005;clip-path:polygon(50% 0,90% 5%,100% 16%,100% 80%,50% 100%,0 80%,0 16%,10% 5%);overflow:hidden}
.fc:before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.38) 46%,transparent 62%)}
.fc.t-bronze{background:linear-gradient(160deg,#f3d1ac,#c8803f 45%,#8c5222)}
.fc.t-silver{background:linear-gradient(160deg,#f6f8fa,#b4bec8 45%,#7d8997)}
.fc.t-gold{background:linear-gradient(160deg,#fff0b0,#eab920 45%,#b3830a)}
.fc.t-icon{background:linear-gradient(160deg,#3a2f10,#0d0b05 55%,#4a3a12);color:var(--ac3)}
.fc-top{display:flex;width:100%;justify-content:space-between;align-items:flex-start;padding:2px 12px 0}
.fc-ov{font-size:30px;font-weight:800;line-height:1}
.fc-pos{display:inline-block;margin-top:4px;font-size:11px;font-weight:800;padding:1px 7px;border-radius:6px;color:#fff;background:#555}
.fc-logo{width:30px;height:30px;border-radius:8px;background:var(--logo) center/cover}
.fc-sh svg{width:64px;height:64px;margin-top:-2px}
.fc-name{font-weight:800;font-size:13px;letter-spacing:.5px;text-transform:uppercase;max-width:122px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin:0 0 5px;border-bottom:1px solid rgba(0,0,0,.28);padding-bottom:3px}
.t-icon .fc-name{border-color:rgba(255,224,138,.35)}
.fc-st{display:grid;grid-template-columns:1fr 1fr;gap:1px 16px;font-size:11px;font-weight:700}.fc-st b{font-size:13px;margin-right:3px}
.fc.big{zoom:1.4}
.pitch{position:relative;max-width:470px;margin:0 auto;aspect-ratio:3/4;border-radius:16px;border:2px solid rgba(255,255,255,.4);background:repeating-linear-gradient(180deg,#22733f 0 10%,#1c6136 10% 20%);box-shadow:0 12px 34px rgba(0,0,0,.5),inset 0 0 60px rgba(0,0,0,.25);overflow:hidden}
.pitch>svg.lines{position:absolute;inset:0;width:100%;height:100%}
.slot{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;width:25%;min-width:70px}
.slot .shirt{width:42px;height:42px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.55))}
.slot .sp{font-size:9px;font-weight:800;color:#fff;padding:0 6px;border-radius:6px;margin-bottom:1px}
.slot select{width:100%;font-size:11px;padding:2px 2px;margin-top:1px;background:rgba(8,8,8,.78);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:7px;text-align:center}
#toast{display:none;position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(135deg,var(--ac),var(--ac2));color:#17120a;padding:11px 16px;border-radius:12px;font-weight:700;z-index:30;max-width:540px;margin:0 auto;box-shadow:0 10px 30px rgba(0,0,0,.5)}
@media(max-width:820px){.app{display:block;padding:10px}aside{position:sticky;top:0;z-index:20;flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 10px;border-radius:14px;margin-bottom:12px;max-height:none;overflow:visible}.brand img{width:36px;height:36px}.brand .sub{display:none}nav{flex-direction:row;overflow-x:auto;flex:1 1 100%;order:3;padding-bottom:2px}nav button{width:auto;white-space:nowrap;padding:7px 11px}.sfoot{margin-left:auto}}
</style></head><body>

 return Object.keys(m).map(function(k){var r=m[k];r.ga=r.g+r.a;r.pts=r.g*PTS.g+r.a*PTS.a+r.c*PTS.c+r.w*PTS.w+r.m*PTS.m+r.wk*PTS.wk+r.mo*PTS.mo;return r})}
