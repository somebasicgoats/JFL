<style>

.pitch{position:relative;max-width:470px;margin:0 auto;aspect-ratio:3/4;border-radius:16px;border:2px solid rgba(255,255,255,.4);background:repeating-linear-gradient(180deg,#22733f 0 10%,#1c6136 10% 20%);box-shadow:0 12px 34px rgba(0,0,0,.5),inset 0 0 60px rgba(0,0,0,.25);overflow:hidden}

create or replace function public.jfl_admin() returns boolean
language sql stable security definer set search_path='' as $$
 select exists(select 1 from public.profiles where id=auth.uid() and is_admin);
$$;

-- Match the existing game's primary-key type, including older league schemas.
do $$
declare game_key text;
begin
 select format_type(atttypid,atttypmod) into strict game_key from pg_attribute
 where attrelid='public.games'::regclass and attname='id';
 execute format('create table if not exists public.match_chat (
 id uuid primary key default gen_random_uuid(), game_id %s not null references public.games(id) on delete cascade,
 author_id uuid not null default auth.uid() references auth.users(id) on delete cascade,
 body text not null check(length(trim(body)) between 1 and 1000), created_at timestamptz not null default now())',game_key);
end $$;
create index if not exists jfl_chat_match_time on public.match_chat(game_id,created_at);
alter table public.match_chat enable row level security;
drop policy if exists jfl_chat_read on public.match_chat;
create policy jfl_chat_read on public.match_chat for select to authenticated using (true);
drop policy if exists jfl_chat_write on public.match_chat;
create policy jfl_chat_write on public.match_chat for insert to authenticated with check (author_id=auth.uid() and length(trim(body)) between 1 and 1000);
grant select,insert on public.match_chat to authenticated;

create table if not exists public.league_polls(
 id bigint generated by default as identity primary key, kind text not null,
 period text not null, label text not null, candidates jsonb not null, active boolean not null default true,
 category text default 'player',game_type text default 'all');
alter table public.league_polls add column if not exists category text default 'player';
alter table public.league_polls add column if not exists game_type text default 'all';
do $$
declare poll_key text;
begin
 select format_type(atttypid,atttypmod) into strict poll_key from pg_attribute
 where attrelid='public.league_polls'::regclass and attname='id';
 execute format('create table if not exists public.league_votes(
 poll_id %s not null references public.league_polls(id) on delete cascade,
 voter uuid not null default auth.uid() references auth.users(id) on delete cascade,
 choice text not null, primary key(poll_id,voter))',poll_key);
end $$;
create unique index if not exists jfl_one_vote on public.league_votes(poll_id,voter);
alter table public.league_polls enable row level security;
alter table public.league_votes enable row level security;
drop policy if exists jfl_poll_read on public.league_polls;
create policy jfl_poll_read on public.league_polls for select using(true);
drop policy if exists jfl_poll_admin on public.league_polls;
create policy jfl_poll_admin on public.league_polls for all to authenticated using(public.jfl_admin()) with check(public.jfl_admin());
drop policy if exists jfl_my_vote on public.league_votes;
create policy jfl_my_vote on public.league_votes for select to authenticated using(voter=auth.uid());
drop policy if exists jfl_cast_vote on public.league_votes;
create policy jfl_cast_vote on public.league_votes for insert to authenticated with check(
 voter=auth.uid() and exists(select 1 from public.league_polls p where p.id=poll_id and p.active and to_jsonb(p.candidates) ? choice));
create or replace function public.jfl_vote_totals() returns table(poll_id text,choice text,total bigint)
language sql stable security definer set search_path='' as $$
 select v.poll_id::text,v.choice,count(*) from public.league_votes v group by v.poll_id,v.choice
$$;
grant select on public.league_polls to anon,authenticated;
grant insert,update on public.league_polls to authenticated;
grant insert,select on public.league_votes to authenticated;
do $$ declare seq text:=pg_get_serial_sequence('public.league_polls','id');
begin if seq is not null then execute format('grant usage on sequence %s to authenticated',seq);end if;end $$;
grant execute on function public.jfl_vote_totals() to anon,authenticated;

create table if not exists public.jfl_user_lineups(
 id uuid primary key default gen_random_uuid(), owner uuid not null default auth.uid() references auth.users(id) on delete cascade,
 title text not null check(length(trim(title)) between 1 and 60), formation text not null,
 slots jsonb not null check(jsonb_typeof(slots)='object'),published boolean not null default false,
 created_at timestamptz not null default now());
alter table public.jfl_user_lineups enable row level security;
drop policy if exists jfl_lineup_read on public.jfl_user_lineups;
create policy jfl_lineup_read on public.jfl_user_lineups for select using(published or owner=auth.uid());
drop policy if exists jfl_lineup_write on public.jfl_user_lineups;
create policy jfl_lineup_write on public.jfl_user_lineups for all to authenticated using(owner=auth.uid()) with check(owner=auth.uid());
grant select on public.jfl_user_lineups to anon,authenticated;
grant insert,update on public.jfl_user_lineups to authenticated;

-- Preserve the original credential derivation when correcting a roster name.
create table if not exists public.jfl_login_names(
 account_id uuid primary key references auth.users(id) on delete cascade,
 original_key text not null unique);
alter table public.jfl_login_names enable row level security;
revoke all on public.jfl_login_names from public,anon,authenticated;
create or replace function public.jfl_login_key(player_name text) returns text
language sql stable security definer set search_path='' as $$
 select n.original_key from public.jfl_login_names n join public.profiles p on p.id=n.account_id
 where lower(trim(p.name))=lower(trim(player_name));
$$;
create or replace function public.jfl_rename(account_id uuid,new_name text) returns void
language plpgsql security definer set search_path='' as $$
declare old_name text; fixed text:=trim(regexp_replace(new_name,'[[:space:]]+',' ','g'));
begin
 if not public.jfl_admin() then raise exception 'Admin access required';end if;
 if length(fixed) not between 3 and 40 or fixed is null then raise exception 'Invalid player name';end if;
 lock table public.profiles in share row exclusive mode;
 select name into strict old_name from public.profiles p where p.id=$1;
 if exists(select 1 from public.profiles p where lower(trim(p.name))=lower(fixed) and p.id<>$1)
 or exists(select 1 from public.jfl_login_names n where n.original_key=lower(fixed) and n.account_id<>$1)
 then raise exception 'This name belongs to another account';end if;
 insert into public.jfl_login_names values($1,lower(trim(old_name))) on conflict on constraint jfl_login_names_pkey do nothing;
 if exists(select 1 from information_schema.columns where table_schema='public' and table_name='profiles' and column_name='name_key' and is_generated='NEVER') then
 execute 'update public.profiles set name=$1,name_key=lower($1) where id=$2' using fixed,$1;
 else update public.profiles set name=fixed where id=$1;end if;
 update auth.users set raw_user_meta_data=coalesce(raw_user_meta_data,'{}'::jsonb)||jsonb_build_object('name',fixed) where id=$1;
end $$;
revoke all on function public.jfl_rename(uuid,text) from public,anon;
grant execute on function public.jfl_rename(uuid,text) to authenticated;
grant execute on function public.jfl_login_key(text) to anon,authenticated;

create or replace function public.jfl_radar_update(player_name text,changes jsonb) returns void
language plpgsql security definer set search_path='' as $$
begin
 if not public.jfl_admin() then raise exception 'Admin access required';end if;
 if jsonb_typeof(changes)<>'object' or exists(select 1 from jsonb_each(changes) e where
 e.key not in ('pac','sho','pas','dri','def','phy','div','han','kic','ref','spd','gpos')
 or (e.value<>'null'::jsonb and (jsonb_typeof(e.value)<>'number' or e.value::text !~ '^[1-9][0-9]?$'))) then raise exception 'Ratings must be whole numbers from 1 to 99';end if;
 insert into public.players(name_key,name,first,last,attrs,ts) values(lower(trim(player_name)),trim(player_name),'','',jsonb_strip_nulls(changes),(extract(epoch from now())*1000)::bigint)
 on conflict(name_key) do update set attrs=jsonb_strip_nulls(coalesce(public.players.attrs,'{}'::jsonb)||changes),ts=excluded.ts;
end $$;
revoke all on function public.jfl_radar_update(text,jsonb) from public,anon;
grant execute on function public.jfl_radar_update(text,jsonb) to authenticated;
alter table public.players add column if not exists radar jsonb default '{}';
alter table public.profiles add column if not exists shirt_number integer check(shirt_number between 0 and 99);
alter table public.jfl_user_lineups add column if not exists team_name text;
create or replace function public.jfl_shirt(num integer) returns void language sql security definer set search_path='' as $$update public.profiles set shirt_number=num where id=auth.uid()$$;
revoke all on function public.jfl_shirt(integer) from public,anon;
grant execute on function public.jfl_shirt(integer) to authenticated;
create table if not exists public.jfl_comments(id uuid primary key default gen_random_uuid(),player_key text not null,author uuid not null default auth.uid() references auth.users(id) on delete cascade,body text not null check(length(trim(body)) between 1 and 1000),created_at timestamptz default now());
alter table public.jfl_comments enable row level security;
drop policy if exists comments_read on public.jfl_comments;
create policy comments_read on public.jfl_comments for select using(true);
drop policy if exists comments_add on public.jfl_comments;
create policy comments_add on public.jfl_comments for insert to authenticated with check(author=auth.uid());
grant select on public.jfl_comments to anon,authenticated;
grant insert on public.jfl_comments to authenticated;
create or replace function public.jfl_shape_update(player_name text,changes jsonb) returns void
language plpgsql security definer set search_path='' as $$
begin
 if not public.jfl_admin() then raise exception 'Admin access required';end if;
 if jsonb_typeof(changes)<>'object' or exists(select 1 from jsonb_each(changes) e where
 e.key not in ('pac','sho','pas','dri','def','phy','div','han','kic','ref','spd','gpos')
 or (e.value<>'null'::jsonb and (jsonb_typeof(e.value)<>'number' or e.value::text !~ '^[1-9][0-9]?$'))) then raise exception 'Ratings must be whole numbers from 1 to 99';end if;
 insert into public.players(name_key,name,first,last,radar,ts) values(lower(trim(player_name)),trim(player_name),'','',jsonb_strip_nulls(changes),(extract(epoch from now())*1000)::bigint)
 on conflict(name_key) do update set radar=jsonb_strip_nulls(coalesce(public.players.radar,'{}'::jsonb)||changes),ts=excluded.ts;
end $$;
revoke all on function public.jfl_shape_update(text,jsonb) from public,anon;
grant execute on function public.jfl_shape_update(text,jsonb) to authenticated;
notify pgrst,'reload schema';
commit;

function axisPoint(i,count,radius){const angle=2*Math.PI*i/count-Math.PI/2;return [240+radius*Math.cos(angle),173+radius*Math.sin(angle)]}
function radar(keys,values,color){
 const radius=124,point=(i,r)=>axisPoint(i,keys.length,r).join(",");
 const ring=r=>keys.map((k,i)=>point(i,r)).join(" ");
 const outline=keys.map((k,i)=>point(i,radius*values[k]/99)).join(" ");
 const label=k=>radarLabels[k]||t(k);
 return '<svg class="radar" viewBox="0 0 480 350" style="--radar-color:'+color+'" role="group" aria-label="'+phrase("Player attributes","Attributs du joueur")+'">'+
 [.2,.4,.6,.8,1].map(v=>'<polygon points="'+ring(radius*v)+'" class="radar-ring"/>').join("")+
 keys.map((k,i)=>{const [x,y]=axisPoint(i,keys.length,radius);return '<line x1="240" y1="173" x2="'+x+'" y2="'+y+'" class="radar-spoke"/>'}).join("")+
 '<polygon class="radar-fill" points="'+outline+'"/>'+
 keys.map((k,i)=>{const [x,y]=axisPoint(i,keys.length,radius*values[k]/99),[lx,ly]=axisPoint(i,keys.length,150);
 return '<text x="'+lx+'" y="'+ly+'" text-anchor="middle" dominant-baseline="middle">'+esc(label(k))+'</text><g class="radar-handle" data-axis="'+k+'" data-index="'+i+'" transform="translate('+x+' '+y+')" '+(isAdmin?'tabindex="0" role="slider" aria-label="'+esc(label(k))+'" aria-valuemin="1" aria-valuemax="99" aria-valuenow="'+values[k]+'"':'aria-hidden="true"')+'><circle r="19" fill="transparent"/><circle class="radar-dot" r="'+(isAdmin?6:3)+'"/></g>'}).join("")+'</svg>';
}
function bindRadar(){
 const form=$("radar-form");if(!form||!isAdmin)return;
 const svg=form.querySelector(".radar"),handles=[...svg.querySelectorAll("[data-axis]")],save=form.querySelector("[type=submit]");
 let drag=null;
 function move(h,value){
  for(const el of handles){const inp=form.elements.namedItem(el.dataset.axis);if(inp.disabled){inp.disabled=false;inp.value=el.getAttribute("aria-valuenow")}}
  const v=clamp(value,1,99),idx=+h.dataset.index;
  h.setAttribute("aria-valuenow",v);
  h.setAttribute("transform","translate("+axisPoint(idx,handles.length,124*v/99).join(" ")+")");
  svg.querySelector(".radar-fill").setAttribute("points",handles.map((el,i)=>axisPoint(i,handles.length,124*Number(el.getAttribute("aria-valuenow"))/99).join(",")).join(" "));
  const input=form.elements.namedItem(h.dataset.axis);input.value=v;input.disabled=false;save.disabled=false;form.dataset.dirty="true";
 }
 function pointer(e){
  const pt=new DOMPoint(e.clientX,e.clientY).matrixTransform(svg.getScreenCTM().inverse());
  const [x,y]=axisPoint(+drag.handle.dataset.index,handles.length,1);
  move(drag.handle,99*((pt.x-240)*(x-240)+(pt.y-173)*(y-173))/124);
 }
 svg.onpointerdown=e=>{const h=e.target.closest("[data-axis]");if(!h||drag||e.button!==0)return;e.preventDefault();h.focus({preventScroll:true});drag={handle:h,id:e.pointerId};svg.setPointerCapture(e.pointerId)};
 svg.onpointermove=e=>{if(drag?.id===e.pointerId)pointer(e)};
 svg.onpointerup=e=>{if(drag?.id===e.pointerId){pointer(e);drag=null}};
 svg.onlostpointercapture=svg.onpointercancel=()=>{drag=null};
 svg.onkeydown=e=>{const h=e.target.closest("[data-axis]");if(!h)return;const d={ArrowRight:1,ArrowUp:1,ArrowLeft:-1,ArrowDown:-1}[e.key];if(d){e.preventDefault();move(h,Number(h.getAttribute("aria-valuenow"))+d*(e.shiftKey?5:1))}};
 form.querySelector("[data-auto]").onclick=()=>{for(const input of form.querySelectorAll("input")){input.value="";input.disabled=false}
 const ratings=cardRatings(PSEL,handles.length===5?"field":"keeper");
 for(const h of handles){move(h,ratings[h.dataset.axis]);form.elements.namedItem(h.dataset.axis).value=""}};
}

 form.onsubmit=async e=>{e.preventDefault();const button=form.querySelector("button");button.disabled=true;try{const row={team_name:gv("lu-team").trim()||tn("Team "+JT),title:personalTitle.trim(),published:personalPublic,formation:LU[JT].f,slots:LU[JT].s};if(!row.title)return;const query=sb.from("jfl_user_lineups");const res=chk(await (personalId?query.update(row).eq("id",personalId).eq("owner",ME.id):query.insert({...row,owner:ME.id})).select("id").single());personalId=res.data.id;toast(t("lusaved"));render()}catch(err){box.textContent=dataError(err)}finally{button.disabled=false}}}
 if(!sb)return;
 const result=await sb.from("jfl_user_lineups").select("*").order("created_at",{ascending:false});if(!area.isConnected)return;
 if(result.error){box.textContent=dataError(result.error);return}
 personalItems=result.data;box.innerHTML='<ul>'+personalItems.map((r,i)=>'<li><span><b>'+esc(r.title)+'</b> · '+esc(S.accts.find(a=>a.id===r.owner)?.name||t("player"))+'<br><small>'+esc([r.team_name,r.formation].filter(Boolean).join(' · '))+' · '+(r.published?phrase("Public","Publique"):phrase("Private","Privée"))+'</small></span><button class="btn ghost" data-load="'+i+'">'+phrase("Load","Charger")+'</button></li>').join("")+'</ul>'+(personalItems.length?'':t("none"));
 box.onclick=e=>{const b=e.target.closest("[data-load]");if(!b)return;const r=personalItems[+b.dataset.load];if(!Object.hasOwn(FORM,r.formation))return;LU[JT]={f:r.formation,s:clone(r.slots),t:1};personalId=ME?.id===r.owner?r.id:null;teamDraft[JT]=r.team_name||tn("Team "+JT);personalTitle=r.title;personalPublic=!!personalId&&r.published;render()};
}

document.addEventListener("submit",async e=>{
 const f=e.target;if(!["radar-form","rename-form"].includes(f.id))return;e.preventDefault();if(!ME||!isAdmin)return;
 const btn=f.querySelector("button");btn.disabled=true;
 try{if(f.id==="radar-form"){
  const vals={};for(const input of f.querySelectorAll("input:enabled"))vals[input.name]=input.value===""?null:Number(input.value);
  chk(await sb.rpc("jfl_shape_update",{player_name:PSEL,changes:vals}));
 }else{const name=f.elements.player.value.trim().replace(/\s+/g," ");if(!NAME_RE.test(name))return toast(t("useformat"));
 chk(await sb.rpc("jfl_rename",{account_id:f.elements.account.value,new_name:name}));await loadMe()}
 await loadAll();render();toast(t("save"));
 }catch(err){toast(dataError(err))}finally{btn.disabled=false}
});
