alter table public.games add column if not exists friendly boolean not null default false;
alter table public.submissions add column if not exists friendly boolean not null default false;
alter table public.awards add column if not exists game_type text;

create or replace function public.jfl_admin() returns boolean
language sql stable security definer set search_path='' as $$
 select exists(select 1 from public.profiles where id=auth.uid() and is_admin);
$$;

-- Match the existing game's primary-key type, including older league schemas.
do $$
declare game_key text;
begin
 select format_type(atttypid,atttypmod) into strict game_key from pg_attribute
 where attrelid='public.games'::regclass and attname='id';
 execute format('create table if not exists public.match_chat (
 id uuid primary key default gen_random_uuid(), game_id %s not null references public.games(id) on delete cascade,
 author_id uuid not null default auth.uid() references auth.users(id) on delete cascade,
 body text not null check(length(trim(body)) between 1 and 1000), created_at timestamptz not null default now())',game_key);
end $$;
create index if not exists jfl_chat_match_time on public.match_chat(game_id,created_at);
alter table public.match_chat enable row level security;
drop policy if exists jfl_chat_read on public.match_chat;
create policy jfl_chat_read on public.match_chat for select to authenticated using (true);
drop policy if exists jfl_chat_write on public.match_chat;
create policy jfl_chat_write on public.match_chat for insert to authenticated with check (author_id=auth.uid() and length(trim(body)) between 1 and 1000);
grant select,insert on public.match_chat to authenticated;

create table if not exists public.league_polls(
 id bigint generated by default as identity primary key, kind text not null,
 period text not null, label text not null, candidates jsonb not null, active boolean not null default true,
 category text default 'player',game_type text default 'all');
alter table public.league_polls add column if not exists category text default 'player';
alter table public.league_polls add column if not exists game_type text default 'all';
do $$
declare poll_key text;
begin
 select format_type(atttypid,atttypmod) into strict poll_key from pg_attribute
 where attrelid='public.league_polls'::regclass and attname='id';
 execute format('create table if not exists public.league_votes(
 poll_id %s not null references public.league_polls(id) on delete cascade,
 voter uuid not null default auth.uid() references auth.users(id) on delete cascade,
 choice text not null, primary key(poll_id,voter))',poll_key);
end $$;
create unique index if not exists jfl_one_vote on public.league_votes(poll_id,voter);
alter table public.league_polls enable row level security;
alter table public.league_votes enable row level security;
drop policy if exists jfl_poll_read on public.league_polls;
create policy jfl_poll_read on public.league_polls for select using(true);
drop policy if exists jfl_poll_admin on public.league_polls;
create policy jfl_poll_admin on public.league_polls for all to authenticated using(public.jfl_admin()) with check(public.jfl_admin());
drop policy if exists jfl_my_vote on public.league_votes;
create policy jfl_my_vote on public.league_votes for select to authenticated using(voter=auth.uid());
drop policy if exists jfl_cast_vote on public.league_votes;
create policy jfl_cast_vote on public.league_votes for insert to authenticated with check(
 voter=auth.uid() and exists(select 1 from public.league_polls p where p.id=poll_id and p.active and to_jsonb(p.candidates) ? choice));
create or replace function public.jfl_vote_totals() returns table(poll_id text,choice text,total bigint)
language sql stable security definer set search_path='' as $$
 select v.poll_id::text,v.choice,count(*) from public.league_votes v group by v.poll_id,v.choice
$$;
grant select on public.league_polls to anon,authenticated;
grant insert,update on public.league_polls to authenticated;
grant insert,select on public.league_votes to authenticated;
do $$ declare seq text:=pg_get_serial_sequence('public.league_polls','id');
begin if seq is not null then execute format('grant usage on sequence %s to authenticated',seq);end if;end $$;
grant execute on function public.jfl_vote_totals() to anon,authenticated;

create table if not exists public.jfl_user_lineups(
 id uuid primary key default gen_random_uuid(), owner uuid not null default auth.uid() references auth.users(id) on delete cascade,
 title text not null check(length(trim(title)) between 1 and 60), formation text not null,
 slots jsonb not null check(jsonb_typeof(slots)='object'),published boolean not null default false,
 created_at timestamptz not null default now());
alter table public.jfl_user_lineups enable row level security;
drop policy if exists jfl_lineup_read on public.jfl_user_lineups;
create policy jfl_lineup_read on public.jfl_user_lineups for select using(published or owner=auth.uid());
drop policy if exists jfl_lineup_write on public.jfl_user_lineups;
create policy jfl_lineup_write on public.jfl_user_lineups for all to authenticated using(owner=auth.uid()) with check(owner=auth.uid());
grant select on public.jfl_user_lineups to anon,authenticated;
grant insert,update on public.jfl_user_lineups to authenticated;

-- Preserve the original credential derivation when correcting a roster name.
create table if not exists public.jfl_login_names(
 account_id uuid primary key references auth.users(id) on delete cascade,
 original_key text not null unique);
alter table public.jfl_login_names enable row level security;
revoke all on public.jfl_login_names from public,anon,authenticated;
create or replace function public.jfl_login_key(player_name text) returns text
language sql stable security definer set search_path='' as $$
 select n.original_key from public.jfl_login_names n join public.profiles p on p.id=n.account_id
 where lower(trim(p.name))=lower(trim(player_name));
$$;
create or replace function public.jfl_rename(account_id uuid,new_name text) returns void
language plpgsql security definer set search_path='' as $$
declare old_name text; fixed text:=trim(regexp_replace(new_name,'[[:space:]]+',' ','g'));
begin
 if not public.jfl_admin() then raise exception 'Admin access required';end if;
 if length(fixed) not between 3 and 40 or fixed is null then raise exception 'Invalid player name';end if;
 lock table public.profiles in share row exclusive mode;
 select name into strict old_name from public.profiles p where p.id=$1;
 if exists(select 1 from public.profiles p where lower(trim(p.name))=lower(fixed) and p.id<>$1)
 or exists(select 1 from public.jfl_login_names n where n.original_key=lower(fixed) and n.account_id<>$1)
 then raise exception 'This name belongs to another account';end if;
 insert into public.jfl_login_names values($1,lower(trim(old_name))) on conflict on constraint jfl_login_names_pkey do nothing;
 if exists(select 1 from information_schema.columns where table_schema='public' and table_name='profiles' and column_name='name_key' and is_generated='NEVER') then
 execute 'update public.profiles set name=$1,name_key=lower($1) where id=$2' using fixed,$1;
 else update public.profiles set name=fixed where id=$1;end if;
 update auth.users set raw_user_meta_data=coalesce(raw_user_meta_data,'{}'::jsonb)||jsonb_build_object('name',fixed) where id=$1;
end $$;
revoke all on function public.jfl_rename(uuid,text) from public,anon;
grant execute on function public.jfl_rename(uuid,text) to authenticated;
grant execute on function public.jfl_login_key(text) to anon,authenticated;

create or replace function public.jfl_radar_update(player_name text,changes jsonb) returns void
language plpgsql security definer set search_path='' as $$
begin
 if not public.jfl_admin() then raise exception 'Admin access required';end if;
 if jsonb_typeof(changes)<>'object' or exists(select 1 from jsonb_each(changes) e where
 e.key not in ('pac','sho','pas','dri','def','phy','div','han','kic','ref','spd','gpos')
 or (e.value<>'null'::jsonb and (jsonb_typeof(e.value)<>'number' or e.value::text !~ '^[1-9][0-9]?$'))) then raise exception 'Ratings must be whole numbers from 1 to 99';end if;
 insert into public.players(name_key,name,first,last,attrs,ts) values(lower(trim(player_name)),trim(player_name),'','',jsonb_strip_nulls(changes),(extract(epoch from now())*1000)::bigint)
 on conflict(name_key) do update set attrs=jsonb_strip_nulls(coalesce(public.players.attrs,'{}'::jsonb)||changes),ts=excluded.ts;
end $$;
revoke all on function public.jfl_radar_update(text,jsonb) from public,anon;
grant execute on function public.jfl_radar_update(text,jsonb) to authenticated;
alter table public.players add column if not exists radar jsonb default '{}';
alter table public.profiles add column if not exists shirt_number integer check(shirt_number between 0 and 99);
alter table public.jfl_user_lineups add column if not exists team_name text;
create or replace function public.jfl_shirt(num integer) returns void language sql security definer set search_path='' as $$update public.profiles set shirt_number=num where id=auth.uid()$$;
revoke all on function public.jfl_shirt(integer) from public,anon;
grant execute on function public.jfl_shirt(integer) to authenticated;
create table if not exists public.jfl_comments(id uuid primary key default gen_random_uuid(),player_key text not null,author uuid not null default auth.uid() references auth.users(id) on delete cascade,body text not null check(length(trim(body)) between 1 and 1000),created_at timestamptz default now());
alter table public.jfl_comments enable row level security;
drop policy if exists comments_read on public.jfl_comments;
create policy comments_read on public.jfl_comments for select using(true);
drop policy if exists comments_add on public.jfl_comments;
create policy comments_add on public.jfl_comments for insert to authenticated with check(author=auth.uid());
grant select on public.jfl_comments to anon,authenticated;
grant insert on public.jfl_comments to authenticated;
create or replace function public.jfl_shape_update(player_name text,changes jsonb) returns void
language plpgsql security definer set search_path='' as $$
begin
 if not public.jfl_admin() then raise exception 'Admin access required';end if;
 if jsonb_typeof(changes)<>'object' or exists(select 1 from jsonb_each(changes) e where
 e.key not in ('pac','sho','pas','dri','def','phy','div','han','kic','ref','spd','gpos')
 or (e.value<>'null'::jsonb and (jsonb_typeof(e.value)<>'number' or e.value::text !~ '^[1-9][0-9]?$'))) then raise exception 'Ratings must be whole numbers from 1 to 99';end if;
 insert into public.players(name_key,name,first,last,radar,ts) values(lower(trim(player_name)),trim(player_name),'','',jsonb_strip_nulls(changes),(extract(epoch from now())*1000)::bigint)
 on conflict(name_key) do update set radar=jsonb_strip_nulls(coalesce(public.players.radar,'{}'::jsonb)||changes),ts=excluded.ts;
end $$;
revoke all on function public.jfl_shape_update(text,jsonb) from public,anon;
grant execute on function public.jfl_shape_update(text,jsonb) to authenticated;
create table if not exists public.jfl_group_members(
 account_id uuid primary key references auth.users(id) on delete cascade,
 player text not null,
 group_id text not null
);
alter table public.jfl_group_members enable row level security;
drop policy if exists jfl_group_read on public.jfl_group_members;
create policy jfl_group_read on public.jfl_group_members for select using(true);
revoke insert,update,delete on public.jfl_group_members from anon,authenticated;
grant select on public.jfl_group_members to anon,authenticated;
create or replace function public.jfl_join_group(chosen text) returns void
language plpgsql security definer set search_path='' as $$
declare player_name text;
begin
 select name into player_name from public.profiles where id=auth.uid();
 if player_name is null or not exists(select 1 from public.settings where key='group-picker' and value='true'::jsonb) then
  raise exception 'Group registration is closed';
 end if;
 if not exists(select 1 from public.settings s cross join lateral jsonb_array_elements(case when jsonb_typeof(s.value)='array' then s.value else '[]'::jsonb end) g where s.key='groups' and g->>'id'=chosen) then
  raise exception 'Group unavailable';
 end if;
 insert into public.jfl_group_members(account_id,player,group_id) values(auth.uid(),player_name,chosen)
 on conflict(account_id) do update set player=excluded.player,group_id=excluded.group_id;
end $$;
revoke all on function public.jfl_join_group(text) from public,anon;
grant execute on function public.jfl_join_group(text) to authenticated;
alter table public.league_polls drop constraint if exists league_polls_kind_check;
alter table public.league_polls add constraint league_polls_kind_check check(kind in ('match','week','month','season'));
alter table public.league_polls drop constraint if exists league_polls_kind_period_key;
create unique index if not exists jfl_season_poll_category on public.league_polls(period,category,game_type) where kind='season';

-- Public player profile values can be edited by their owner or a league admin.
create or replace function public.jfl_save_player_bio(player_key text, birth_date date, country_code text)
returns void language plpgsql security definer set search_path='' as $$
begin
 if auth.uid() is null or (not public.jfl_admin() and not exists (
   select 1 from public.profiles where id=auth.uid()
   and lower(regexp_replace(btrim(name),'\s+',' ','g'))=player_key
 )) then
  raise exception 'You can only edit your own profile';
 end if;
 if length(player_key) not between 1 and 120 or birth_date > current_date
    or birth_date < date '1900-01-01' or coalesce(country_code,'') !~ '^([A-Z]{2})?$' then
  raise exception 'Invalid player profile';
 end if;
 insert into public.settings(key,value)
 values ('bio:'||player_key,jsonb_build_object('birth',birth_date,'country',coalesce(country_code,'')))
 on conflict (key) do update set value=excluded.value;
end $$;
revoke all on function public.jfl_save_player_bio(text,date,text) from public,anon;
grant execute on function public.jfl_save_player_bio(text,date,text) to authenticated;

notify pgrst,'reload schema';
commit;

async function bindChat(){

 const field=form.querySelector("textarea"),button=form.querySelector("button"),status=form.querySelector("[role=status]");

 async function refresh(){
  const token=++request;
  const res=await sb.from("match_chat").select("id,author_id,body,created_at").eq("game_id",box.dataset.id).order("created_at",{ascending:false}).order("id",{ascending:false}).limit(100);

 }

  if(body!==lastBody){messageId=crypto.randomUUID();lastBody=body}
  button.disabled=true;field.readOnly=true;status.textContent="";
  try{const r=await sb.from("match_chat").insert({game_id:box.dataset.id,body,author_id:ME.id,id:messageId});if(r.error&&r.error.code!=="23505")throw r.error;

function recordsView(){
 const pairs=new Map(),scoring=[],margins=[],comebacks=[],cleanWins=[];
 for(const g of recordGames()){
  scoring.push({g,value:score(g,0)+score(g,1)});margins.push({g,value:Math.abs(score(g,0)-score(g,1))});
  const goals=[score(g,0),score(g,1)];
  if(Math.min(...goals)===0)cleanWins.push({g,value:Math.max(...goals)});
  if(goals[0]!==goals[1]){
   const winner=goals[0]>goals[1]?0:1,seen=[0,0];let deficit=0;
   const timeline=(g.events||[]).slice().sort((a,b)=>(a.m??Infinity)-(b.m??Infinity));
   for(const e of timeline){seen[e.og?1-e.t:e.t]++;deficit=Math.max(deficit,seen[1-winner]-seen[winner])}
   if(timeline.every(e=>e.m!=null)&&seen.every((n,i)=>n===goals[i]))comebacks.push({g,value:deficit});
  }
  for(const event of g.events||[]){
   if(event.og||!event.a||!event.s||isNA(event.a)||isNA(event.s)||nk(event.a)===nk(event.s))continue;
   const key=JSON.stringify([nk(event.a),nk(event.s)]);
   const pair=pairs.get(key)||{assist:event.a,scorer:event.s,total:0,matches:new Map()};
   pair.total++;pair.matches.set(g,(pair.matches.get(g)||0)+1);pairs.set(key,pair);
  }
 }

function careerRealRatings(from,to){
 const totalsByPlayer=new Map();
 for(const game of S.games){
  if(game.friendly||game.date<from||game.date>to)continue;
  const scores=[score(game,0),score(game,1)];
  game.teams.forEach((team,i)=>{
   for(const player of team.players){
    if(isNA(player.n)||!player.n)continue;
    const key=nk(player.n),s=totalsByPlayer.get(key)||{gp:0,g:0,a:0,c:0,m:0,w:0};
    s.gp++;
    for(const stat of ["g","a","c"])s[stat]+=Number(player[stat]||0);
    s.m+=Number(nk(game.motm||"")===key);
    s.w+=Number(scores[i]>scores[1-i]);
    totalsByPlayer.set(key,s);
   }
  });
 }
 return totalsByPlayer;
}
function careerProjection(name,role,stats,date,useOverride=true){
 const key=nk(name),s=stats.get(key)||{gp:0,g:0,a:0,c:0,m:0,w:0};
 const rate=stat=>s[stat]/(s.gp+5);
 const weights=role==="GK"?[.12,.25,1.75]:POS[role]==="def"?[.65,1,1.08]:POS[role]==="mid"?[1,1.25,.43]:[1.25,.95,.3];
 const impact=weights[0]*rate("g")+weights[1]*rate("a")+weights[2]*rate("c")+1.35*rate("m")+.34*rate("w");
 const autoTalent=careerBound(Math.round(43+34*(1-Math.exp(-impact*.95))+Math.min(7,Math.log1p(s.gp)*1.7)),43,84);
 const age=careerAgeAt({original:true,birth:playerBio(key).birth},date);
 const autoPotential=careerBound(autoTalent+Math.round(careerBound(25-age,0,11)*.85+Math.min(7,impact*4)+2),autoTalent,96);
 const override=useOverride?config("career-rating:"+key):null;
 const talent=Number.isInteger(override?.talent)?override.talent:autoTalent;
 const potential=Math.max(talent,Number.isInteger(override?.potential)?override.potential:autoPotential);
 const attackBias=role==="GK"?-13:POS[role]==="att"?5:POS[role]==="def"?-5:0;
 const defenceBias=role==="GK"?2:POS[role]==="def"?5:POS[role]==="att"?-5:0;
 return {attack:careerBound(talent+attackBias,20,99),defence:careerBound(talent+defenceBias,20,99),
  engine:careerBound(talent-attackBias-defenceBias-(role==="GK"?13:0),20,99),
  potential,sample:s.gp,autoTalent,autoPotential,seedTalent:talent};
}

function careerDevelopment(p,c,weeks=1){
 const age=careerAgeAt(p,c.date),declineAt=p.pos==="GK"?33:30;
 if(age<declineAt)return;
 const before=careerRating(p);
 const decline=(age-declineAt+1)*(p.pos==="GK"?.13:.19)*(1+(100-p.fitness)/130)*weeks;
 p.engine=Math.max(20,p.engine-decline);
 p.attack=Math.max(20,p.attack-decline*.55);
 p.defence=Math.max(20,p.defence-decline*.4);
 p.potential=Math.max(careerRating(p),p.potential-decline*.55);
 if(p.original&&Math.floor(before)>careerRating(p)&&[4,9,14].includes(c.round)){
  careerLog(c,p.name+"'s age-related decline has affected their ability.","Development");
 }
}

function careerNewLeague(c){

 c.clubs=[{id:"jfl",name:"JFL FC",rating:tier.rating},...Array.from({length:7},(_,i)=>({id:"opp"+i,name:careerTowns[offset+i]+([" FC"," SC"," Athletic"][i%3]),rating:base+careerDifficulty(c).rival+careerInt(c,-6,6)}))];

  p.id=c.year+"-"+p.id;

  const p=careerFictional(c,"market-"+c.year,i,tier.rating-1,c.year);

 });
 c.selection=Array.from({length:11},(_,i)=>c.players.some(p=>p.id===c.selection[i])?c.selection[i]:"");
 careerLedger(c,-tier.fee,"Season registration");
}
function careerFixtureDate(c,index=c.round){
 const days=Math.floor((Date.parse(c.end)-Date.parse(c.start))/86400000);
 const target=shiftDay(c.start,Math.round(days*(index+1)/(c.fixtures.length+1)));
 if(days<100)return target;
 const dow=new Date(target+"T12:00:00Z").getUTCDay(),desired=c.level===0?5:c.level===1?0:6;

function careerAvailable(p,c){return p.injury<=0&&p.suspension<=0&&!(p.awayUntil&&p.awayUntil>=c.date)}
function careerBuildXI(c,roster,formation,manual=[]){
 const slots=careerShape[formation],used=new Set();
 const available=roster.filter(p=>careerAvailable(p,c));
 const pinned=slots.map((_,i)=>{
  const p=available.find(player=>player.id===manual[i]&&!used.has(player.id));
  if(p)used.add(p.id);
  return p;
 });
 return slots.flatMap((position,slot)=>{
  const rank=p=>careerRating(p)*.66+p.fitness*.22+p.sharpness*.12+(p.pos===position?13:p.positions.includes(position)?10:POS[p.pos]===POS[position]?1:-12);
  const pick=pinned[slot]||available.filter(p=>!used.has(p.id)).sort((a,b)=>rank(b)-rank(a))[0];
  if(!pick)return [];
  used.add(pick.id);

function careerWeek(c,until){

   invite.status="Completed";

    careerLog(c,player.name+" returned from "+invite.level+" duty with "+appearances+" appearance"+(appearances===1?"":"s")+".","International");
   }
  }
  if(dow===1){
   const sponsor=[125,170,290,650,1050,2350,7200][c.level]+Math.round(c.rep*11);
   const staffing=[0,135,420][c.coach],wages=c.players.reduce((a,p)=>a+(p.wage||0),0);
   careerLedger(c,Math.round(sponsor*careerDifficulty(c).funding)-careerFacilities[c.facility].weekly-staffing-wages,"Weekly funding less facilities, staff and wages");
   if(c.ended)break;
   if(c.balance<Math.max(500,(staffing+wages)*3)&&(!c.cashWarning||c.cashWarning<=shiftDay(date,-14))){
    c.cashWarning=date;
    careerLog(c,"Cash reserves are low. Review wages and facility costs before advancing.","Finance");
   }
  }
  const sessions=c.training.filter(s=>s.day===dow);
  for(const p of c.opponents)p.fitness=Math.min(100,p.fitness+4);
  for(const p of c.players){
   if(p.injury>0)p.injury--;
   const age=careerAgeAt(p,date);
   p.fitness=Math.min(100,p.fitness+(age>=34?2:3));
   if(dow===1)careerDevelopment(p,c);
   if(p.awayUntil&&p.awayUntil>=date)continue;
   for(const s of sessions){
    if(p.injury>0)continue;
    const hour=Number(s.time.split(":")[0]),clash=careerAge(p.birth||birthStart,date)<18&&dow>=1&&dow<=5&&hour<16;
    if(clash&&careerDice(c)<.85){p.morale=Math.max(15,p.morale-.5);continue}
    const recovery=s.focus==="recovery"||p.restUntil>=date;
    const load=recovery?-5:(s.focus==="fitness"?8:5)*s.length/75;
    const condition=p.fitness;p.fitness=careerBound(p.fitness-load,20,100);
    if(load>0&&condition<58&&careerDice(c)<(62-condition)/170){p.injury=careerInt(c,5,25);careerLog(c,p.name+" picked up a training injury ("+p.injury+" days).");continue}
    if(recovery){p.morale=Math.min(100,p.morale+.3);continue}
    const focusSkill={finishing:"attack",defending:"defence",fitness:"engine"}[s.focus];
    const activePlan=p.focusUntil>=date?p.focus:null;
    const attribute=activePlan||focusSkill||(s.focus==="technical"?"attack":["attack","defence","engine"][careerInt(c,0,2)]);
    const growth=age<20?1.4:age<25?1.05:age<30?.6:age<34?.21:.08;
    const gap=careerBound((p.potential-careerAbility(p))/12,0,1);
    const work=careerFacilities[c.facility].gain*(1+c.coach*.19)*s.length/75*p.morale/75*condition/100;
    if(careerDice(c)<.48*work*growth*gap*careerDifficulty(c).development*(activePlan?1.25:1)){
     p[attribute]=Math.min(99,p[attribute]+1);
    }
    p.sharpness=Math.min(100,p.sharpness+1.1*work);
   }
  }
 }
}
function careerPoisson(c,mean){let k=0,product=1;do{k++;product*=careerDice(c)}while(product>Math.exp(-mean)&&k<13);return k-1}
function careerLinePower(c,line,side){
 const get=(r,key)=>r.reduce((n,v)=>n+(v.p[key]||0),0)/Math.max(1,r.length);
 const front=line.filter(r=>POS[r.position]==="att"||POS[r.position]==="mid"),back=line.filter(r=>POS[r.position]==="def"||r.position==="GK");
 const mismatch=line.reduce((sum,{p,position})=>sum+(p.positions.includes(position)?0:POS[p.pos]===POS[position]?1:3),0);
 const modifier=-mismatch*.33+(get(line,"fitness")-85)*.21+(get(line,"morale")-65)*.13+(get(line,"sharpness")-55)*.08-Math.max(0,11-line.length)*5;
 const style=side==="jfl"?c.mentality:"balanced";
 const cohesion=side==="jfl"?Math.min(4,(c.cohesion||0)*.08):0;
 return {off:get(front.length?front:line,"attack")*.68+get(line,"engine")*.32+modifier+cohesion+(style==="attack"?6:style==="cautious"?-5:0),
  def:get(back.length?back:line,"defence")*.8+get(line,"engine")*.2+modifier+cohesion+(style==="cautious"?6:style==="attack"?-5:0)};
}
function careerLeagueResult(c,a,b,ga,gb){
 for(const [id,score,against] of [[a,ga,gb],[b,gb,ga]]){
  const row=c.table[id];row.gp++;row.gf+=score;row.ga+=against;
  if(score>against){row.w++;row.pts+=3}else if(score===against){row.d++;row.pts++}else row.l++;
 }
}
function careerMatchLines(c,sides,rosters){
 return sides.map((id,i)=>careerBuildXI(c,rosters[i],id==="jfl"?c.formation:"4-3-3",id==="jfl"?c.selection:[]));
}
function careerMatchRates(c,sides,lines){
 const power=lines.map((line,i)=>careerLinePower(c,line,sides[i]));
 return sides.map((id,i)=>careerBound((i===0?1.38:1.17)*Math.exp((power[i].off-power[1-i].def)/23)*(id==="jfl"&&c.press==="high"?1.06:1),.12,5.7));
}
function careerMatchRoster(c,sides){
 return sides.map(id=>id==="jfl"?c.players:c.opponents.filter(p=>p.club===id));
}
function careerMatch(c,a,b,friendly=false,live=null){
 const sides=[a,b],rosters=careerMatchRoster(c,sides);
 const lines=live?.starting||careerMatchLines(c,sides,rosters);
 const rates=live?.xg||careerMatchRates(c,sides,lines);
 const short=lines.map(line=>line.length<7);
 const goals=live?.goals||rates.map((n,i)=>short[i]?0:short[1-i]?3:careerPoisson(c,n));
 const report={date:c.date,ids:sides,names:sides.map(id=>careerClub(c,id)),goals,friendly,xg:rates.map(x=>Number(x.toFixed(2))),events:[],box:[],
  formations:sides.map(id=>id==="jfl"?c.formation:"4-3-3")};
 if(short.some(Boolean)){
  report.forfeit=true;report.xg=null;
  report.events.push({kind:"forfeit",minute:0,club:sides[short[0]?0:1],scorer:"Insufficient available players"});
  if(!friendly){
   if(short.every(Boolean)){
    for(const id of sides){c.table[id].gp++;c.table[id].l++}
   }else careerLeagueResult(c,a,b,...goals);
  }
  return report;
 }
 sides.forEach((id,i)=>{
  const lineup=lines[i];
  const changes=live?live.changes[i]:careerAutoSubs(c,rosters[i],lineup).map(change=>({...change,minute:65}));
  const used=[
   ...lineup.map(({p,position,slot})=>({p,position,slot,minutes:changes.find(change=>change.out.p.id===p.id)?.minute??90,start:true})),
   ...changes.map(({out,incoming,minute})=>({p:incoming,position:out.position,slot:out.slot,minutes:90-minute,start:false,minute}))
  ];
  const logs=new Map();
  for(const row of used){
   const s=careerStats();s.gp=1;s.starts=+row.start;s.min=row.minutes;
   s.pass=careerInt(c,14,46)*row.minutes/90|0;s.complete=Math.round(s.pass*careerBound(.59+row.p.engine/290+careerDice(c)*.10,.58,.95));
   s.shots=live?(live.shots.get(row.p.id)||0):row.position==="GK"?0:careerInt(c,0,POS[row.position]==="att"?4:2);
   s.yc=+(careerDice(c)<(id==="jfl"&&c.press==="high"?.17:.105));
   s.rc=live?0:+(careerDice(c)<.017);
   if(row.position==="GK"){s.cs=+(row.minutes>=60&&goals[1-i]===0);s.saves=live?(live.saves.get(row.p.id)||0):careerInt(c,1,7)}
   logs.set(row.p.id,s);
  }
  if(live){
   for(const event of live.events.filter(e=>e.club===id)){
    if(event.kind==="sub")continue;
    if(event.kind==="goal"){logs.get(event.scorerId).g++;if(event.assistId)logs.get(event.assistId).a++}
    report.events.push(event);
   }
  }else{
   for(let n=0;n<goals[i]&&used.length;n++){
    const minute=careerInt(c,1,90),onPitch=used.filter(r=>r.start?minute<=r.minutes:minute>r.minute);
    const event=careerGoalEvent(c,onPitch,id,i,minute);
    logs.get(event.scorerId).g++;if(event.assistId)logs.get(event.assistId).a++;
    report.events.push(event);
   }
   const chances=used.filter(row=>logs.get(row.p.id).shots>logs.get(row.p.id).g);
   for(let n=0;n<Math.min(2,chances.length);n++){
    const [row]=chances.splice(careerInt(c,0,chances.length-1),1);
    const minute=careerInt(c,row.start?1:row.minute+1,row.start?row.minutes:90);
    report.events.push(careerShotEvent(c,row,id,i,minute,careerDice(c)<.5));
   }
  }
  for(const {out,incoming,minute} of changes){
   report.events.push({kind:"sub",minute,club:id,scorer:incoming.name,scorerId:incoming.id,outId:out.p.id,outcome:out.p.name});
  }
  for(const {p,position,slot} of used){
   const s=logs.get(p.id);s.shots=Math.max(s.shots,s.g);
   s.rating=careerBound(6.1+s.g*.74+s.a*.49+s.cs*.59+s.saves*.064-goals[1-i]*.13-s.rc*.8+careerDice(c)*.5,4,10);
   if(!friendly)for(const key of Object.keys(s))p.stats[key]+=s[key];
   report.box.push({id:p.id,club:id,name:p.name,pos:position,slot,...s});
   p.morale=careerBound(p.morale+(goals[i]>goals[1-i]?2:goals[i]<goals[1-i]?-2:.5)+s.g,15,100);
   p.fitness=careerBound(p.fitness-s.min/90*(id==="jfl"?(live?.pressLoad??(c.press==="high"?17:12)):12),20,100);
   p.sharpness=Math.min(100,p.sharpness+4*s.min/90);
   if(!friendly&&s.yc){
    p.cautions=(p.cautions||0)+1;
    if(p.cautions%5===0){
     p.suspension+=1;
     if(id==="jfl")careerLog(c,p.name+" will serve a one-match ban after five yellow cards.","Discipline");
    }
   }
   if(s.rc){
    report.events.push({kind:"red",minute:careerInt(c,30,90),club:id,scorer:p.name});
    if(!friendly)p.suspension+=2;
   }
   if(id==="jfl"&&careerDice(c)<(p.fitness<56?.045:.012)){
    p.injury=careerInt(c,6,39);
    careerLog(c,p.name+" is injured for "+p.injury+" days.","Medical");
   }
  }
 });
 report.events.sort((x,y)=>x.minute-y.minute);
 if(!friendly)careerLeagueResult(c,a,b,...goals);
 return report;
}
function careerAutoSubs(c,roster,lineup){
 const starters=new Set(lineup.map(x=>x.p.id));
 const available=roster.filter(p=>!starters.has(p.id)&&careerAvailable(p,c));
 return lineup.filter(x=>x.position!=="GK").sort((a,b)=>a.p.fitness-b.p.fitness).slice(0,2).flatMap(out=>{
  available.sort((a,b)=>Number(b.positions.includes(out.position))-Number(a.positions.includes(out.position))||careerRating(b)-careerRating(a));
  const incoming=available.shift();
  return incoming?[{out,incoming}]:[];
 });
}
function careerGoalEvent(c,line,club,side,minute){
 const scorer=careerWeighted(c,line,r=>Math.max(1,r.p.attack)*(POS[r.position]==="att"?5:POS[r.position]==="mid"?2:r.position==="GK"?.035:.7));
 const helpers=line.filter(r=>r!==scorer);
 const helper=helpers.length&&careerDice(c)<.74?careerWeighted(c,helpers,r=>r.p.engine*(POS[r.position]==="mid"?2:1)):null;
 return {kind:"goal",minute,club,scorer:scorer.p.name,scorerId:scorer.p.id,assist:helper?.p.name||"",
  assistId:helper?.p.id,x:side===0?careerInt(c,76,94):careerInt(c,6,24),y:careerInt(c,27,73)};
}
function careerShotEvent(c,row,club,side,minute,saved){
 return {kind:"chance",minute,club,scorer:row.p.name,scorerId:row.p.id,outcome:saved?"Shot saved":"Shot wide",
  x:side===0?careerInt(c,66,89):careerInt(c,11,34),y:careerInt(c,24,76)};

function careerClub(c,id){return c.clubs.find(t=>t.id===id)?.name||id}
function careerRound(c,live=null){

  const report=careerMatch(c,a,b,false,a==="jfl"||b==="jfl"?live:null);
  c.matches.push(report);
  if(a==="jfl"||b==="jfl"){
   c.latest=report;const own=a==="jfl"?0:1,gf=report.goals[own],ga=report.goals[1-own];
   c.rep=careerBound(c.rep+(gf>ga?1.65:gf===ga?.65:.15),0,100);
   c.cohesion=careerBound((c.cohesion||0)+(gf>=ga?3:1),0,50);
   if(a==="jfl")careerLedger(c,Math.round(careerTiers[c.level].revenue*careerDifficulty(c).funding)+Math.round(c.rep*10),"Home match revenue");
   careerLog(c,report.names[0]+" "+report.goals.join("–")+" "+report.names[1],"Result");
  }
 }
 for(const p of [...c.players,...c.opponents])if(suspensions.get(p.id)>0)p.suspension=Math.max(0,p.suspension-1);

 if([3,8,12].includes(c.round))careerCallUps(c);
 careerAlumniRound(c);

function careerStandings(c){return c.clubs.map(t=>({...t,...c.table[t.id]})).sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf||a.name.localeCompare(b.name))}
// Simulation scouting tiers, not claims about any federation's current selection rules.
const careerNationalPathways={
 LK:{youth:1,senior:3,youthRating:63,seniorRating:74},
 IN:{youth:2,senior:4,youthRating:67,seniorRating:78},
 MA:{youth:5,senior:6,youthRating:79,seniorRating:90}
};
function careerCallUps(c){
 const candidates=[];
 for(const p of c.players){
  if(!p.country||!p.birth||!careerAvailable(p,c)||p.stats.starts<3)continue;
  if(c.invites.some(i=>i.player===p.id&&(i.status==="pending"||i.date&&i.date>=shiftDay(c.date,-50))))continue;
  const age=careerAge(p.birth,c.date);
  if(age<16)continue;
  const youth=age<=19,level=youth?"U20":"Senior";
  const path=careerNationalPathways[p.country]||{youth:4,senior:6,youthRating:74,seniorRating:86};
  const rating=careerRating(p),form=p.stats.rating/Math.max(1,p.stats.gp);
  if(c.level<(youth?path.youth:path.senior)||rating<(youth?path.youthRating:path.seniorRating)||form<6.3)continue;
  candidates.push({p,level,score:rating+form*2});
 }
 candidates.sort((a,b)=>b.score-a.score);
 for(const {p,level} of candidates.slice(0,3)){
  if(c.date>=shiftDay(c.end,-9)||careerDice(c)>(level==="Senior"?.18:.32))continue;
  c.invites.push({id:c.year+"-"+c.round+"-"+p.id,player:p.id,country:p.country,level,status:"pending",date:c.date,until:shiftDay(c.date,9)});
  careerLog(c,nationalityNames.of(p.country)+" "+level+" invited "+p.name+".","International");
  break;

}

  if(careerDice(c)<.78){p.external.gp++;p.external.g+=+(POS[p.pos]==="att"&&careerDice(c)<.32);p.external.a+=+(careerDice(c)<.23)}

}
function careerNextSeason(c){

  nextLevel=c.level;

 }

 if(nextYear+"-05-01"<=previousEnd)nextYear=Number(previousEnd.slice(0,4))+1;
 c.year=nextYear;c.level=nextLevel;c.requested=nextLevel;
 c.start=c.year+"-05-01";c.end=c.year+"-10-31";c.date=c.start;c.invites=[];c.friendlies=[];c.latest=null;c.talks={};
 const departures=[],retirements=[];
 for(const p of c.players){
  p.fitness=96;p.injury=0;p.sharpness=52;p.suspension=0;p.cautions=0;p.awayUntil="";
  const breakWeeks=Math.floor((Date.parse(c.start)-Date.parse(previousEnd))/604800000);
  careerDevelopment(p,c,Math.max(0,breakWeeks));
  const age=careerAgeAt(p,c.start),retireAt=p.pos==="GK"?38:35;
  if(age>=retireAt&&careerDice(c)<Math.min(1,.28+(age-retireAt)*.24)){retirements.push(p);continue}

  else if(p.original&&p.morale<25&&careerDice(c)<.55)departures.push(p);
 }
 for(const p of retirements){
  careerTransferOut(c,p,"retired",0,true);
 }
 for(const p of departures)careerTransferOut(c,p,"left at the end of the season",0);
 careerNewLeague(c);
 c.cohesion=Math.max(0,(c.cohesion||0)-12);
 c.boardEvent=null;
 if(!c.ended)careerLog(c,"Registration accepted for "+careerTiers[c.level].name+".");

}

  'Raise '+careerMoney(Math.round((450+c.rep*9)*careerDifficulty(c).funding))+' for the club. Each player loses 5 fitness.') :
  (player?.name||"A squad player")+" has been invited to "+nationalityNames.of(decision.country)+" "+decision.level+". If released, the player is unavailable through "+careerWhen(decision.until)+".";

 '<div class="replay-controls"><b data-replay-clock>Kickoff</b><button class="btn ghost" type="button" data-replay-skip>Skip to full time</button><button class="btn" type="button" data-replay-report hidden>Open match report</button></div><p data-replay-status role="status"></p><div data-replay-metrics></div><ol class="replay-feed"></ol>';
 document.body.append(dialog);dialog.showModal();
 const get=selector=>dialog.querySelector(selector),feed=get(".replay-feed"),ball=get(".replay-ball");
 const score=[0,0],events=report.events||[];
 let cursor=0,timer;
 function add(event,animate){
  const side=report.ids.indexOf(event.club);
  if((!event.kind||event.kind==="goal")&&side>=0)score[side]++;
  const item=document.createElement("li");
  item.textContent=event.minute+"′ · "+careerEventText(event);
  feed.prepend(item);
  get("[data-replay-score]").textContent=score.join("–");
  if(!animate)return;
  get("[data-replay-clock]").textContent=event.minute+"′";
  get("[data-replay-status]").textContent=careerEventText(event);
  if(event.kind==="forfeit"||event.kind==="tactics")return;
  const x=event.x??(side===0?81:19);
  ball.hidden=false;
  ball.style.left=(event.minute>45?100-x:x)+"%";
  ball.style.top=(event.y??50)+"%";
  if(ball.animate)ball.animate([{transform:"translate(-50%,-50%) scale(1.65)"},{transform:"translate(-50%,-50%) scale(1)"}],{duration:350});
 }

  clearTimeout(timer);

  get("[data-replay-metrics]").innerHTML=careerMatchMetrics(report.names,report.xg,shots);
 }
 function frame(){
  if(cursor===events.length){finish();return}
  add(events[cursor++],true);timer=setTimeout(frame,Math.max(230,Math.min(770,4800/(events.length+1))));
 }
 dialog.addEventListener("close",()=>{clearTimeout(timer);dialog.remove();if(tab==="manager"&&careerState)careerDecision(careerState)},{once:true});

}

 if(!sides)throw Error("No match available.");
 if(data&&(!data.date||data.date<c.date||careerFixtureDate(c)<=shiftDay(data.date,1)||c.round>=c.fixtures.length||c.friendlies.some(r=>r.date===data.date))){
  throw Error("Choose an unused date before the next league match.");
 }
 careerWeek(c,data?data.date:careerFixtureDate(c));
 const rosters=careerMatchRoster(c,sides),starting=careerMatchLines(c,sides,rosters),own=sides.indexOf("jfl");
 const live={starting,changes:[[],[]],events:[],goals:[0,0],xg:[0,0],shots:new Map(),saves:new Map(),pressLoad:0};
 const lines=starting.map(line=>[...line]);
 const tactics={mentality:c.mentality,press:c.press};
 let minute=0,timer=null,finished=false,report=null;
 function settle(){
  if(finished)return;
  careerState=c;
  try{
   if(data)careerSubmit("friendly",data,starting.some(line=>line.length<7)?null:live);
   else careerRound(c,starting.some(line=>line.length<7)?null:live);
  }catch(error){careerState=original;throw error}
  finished=true;report=c.latest;
  careerSave();render();
 }
 if(c.ended){careerState=c;careerSave();render();return}
 if(starting.some(line=>line.length<7)){settle();careerOpenMatch(report);careerDecision(c);return}
 const names=sides.map(id=>careerClub(c,id));
 const dialog=careerModal("Live match",
  '<div data-live-score></div><div class="career-match-columns"><div data-live-pitch></div><aside>'+
  '<label>Mentality '+careerChoose("mentality",[["cautious","Cautious"],["balanced","Balanced"],["attack","Attacking"]],tactics.mentality)+'</label> '+
  '<label>Pressing '+careerChoose("press",[["low","Low"],["medium","Medium"],["high","High"]],tactics.press)+'</label>'+
  '<div data-live-sub></div><ol class="replay-feed" data-live-events></ol></aside></div>'+
  '<div class="manager-actions"><button class="btn" data-step>Play next 15 minutes</button>'+
  '<button class="btn ghost" data-run>Auto play</button><button class="btn ghost" data-finish>Sim to full time</button>'+
  '<button class="btn" data-live-report hidden>Open match report</button></div>');
 dialog.classList.add("career-wide");
 const find=selector=>dialog.querySelector(selector);
 const bench=rosters[own].filter(p=>careerAvailable(p,c)&&!starting[own].some(row=>row.p.id===p.id));
 function draw(){
  find("[data-live-score]").innerHTML=careerScoreboard(names,live.goals,finished?"Full time":minute===45?"Half-time":minute?minute+"′":"Kickoff")+
   careerMatchMetrics(names,live.xg,lines.map((line,i)=>{
    const ids=new Set([...starting[i].map(row=>row.p.id),...live.changes[i].map(change=>change.incoming.id)]);
    return [...ids].reduce((sum,id)=>sum+(live.shots.get(id)||0),0);
   }));
  find("[data-live-pitch]").innerHTML=careerLineupMaps(names,lines.map(line=>line.map(row=>({id:row.p.id,name:row.p.name,pos:row.position,slot:row.slot}))),false);
  const outs=lines[own].filter(row=>starting[own].includes(row));
  const ins=bench.filter(p=>!live.changes[own].some(change=>change.incoming===p));
  find("[data-live-sub]").innerHTML='<p>Substitutions '+live.changes[own].length+' / 5</p>'+
   (!finished&&minute>0&&live.changes[own].length<5&&ins.length&&outs.length?
   '<label>Off '+careerChoose("out",outs.map(row=>[row.p.id,row.p.name+" · "+row.position]),"")+'</label> '+
   '<label>On '+careerChoose("in",ins.map(p=>[p.id,p.name+" · "+p.pos]),"")+'</label> '+
   '<button class="btn ghost" data-sub>Make substitution</button>':"");
  find("[data-live-events]").innerHTML=[...live.events].reverse().map(event=>'<li>'+event.minute+'′ · '+esc(names[sides.indexOf(event.club)]+" · "+careerEventText(event))+'</li>').join("");
  for(const selector of ["[data-step]","[data-run]","[data-finish]","[name=mentality]","[name=press]"])find(selector).disabled=finished;
  find("[data-live-report]").hidden=!finished;
  find("[data-run]").textContent=timer?"Pause":"Auto play";
  find("[data-dismiss]").textContent=finished?"Close":"Leave match";
 }
 function stop(){clearInterval(timer);timer=null}
 function play(){
  if(finished)return;
  const next=Math.min(90,minute+15),duration=next-minute;
  if(minute===60){
   const rival=1-own;
   for(const change of careerAutoSubs(c,rosters[rival],lines[rival]))substitute(rival,change.out,change.incoming);
  }
  const rates=careerMatchRates({...c,...tactics},sides,lines);
  live.pressLoad+=(tactics.press==="high"?17:tactics.press==="low"?10:12)*duration/90;
  const segment=[];
  sides.forEach((id,i)=>{
   live.xg[i]+=rates[i]*duration/90;
   const goals=careerPoisson(c,rates[i]*duration/90);
   for(let n=0;n<goals;n++)segment.push(careerGoalEvent(c,lines[i],id,i,careerInt(c,minute+1,next)));
   const attempts=careerPoisson(c,(2.6+rates[i])*duration/90);
   for(let n=0;n<attempts;n++){
    const row=careerWeighted(c,lines[i],r=>r.p.attack*(r.position==="GK"?.02:1));
    const saved=careerDice(c)<.4;
    if(saved){
     const keeper=lines[1-i].find(r=>r.position==="GK");
     if(keeper)live.saves.set(keeper.p.id,(live.saves.get(keeper.p.id)||0)+1);
    }
    segment.push(careerShotEvent(c,row,id,i,careerInt(c,minute+1,next),saved));
   }
  });
  for(const event of segment.sort((a,b)=>a.minute-b.minute)){
   if(event.kind==="goal")live.goals[sides.indexOf(event.club)]++;
   live.shots.set(event.scorerId,(live.shots.get(event.scorerId)||0)+1);
   live.events.push(event);
  }
  minute=next;
  if(minute===90){stop();settle()}
 }
 function substitute(side,out,incoming){
  live.changes[side].push({out,incoming,minute});
  lines[side]=lines[side].map(row=>row===out?{...out,p:incoming}:row);
  live.events.push({kind:"sub",minute,club:sides[side],scorer:incoming.name,outcome:out.p.name});
 }
 dialog.onchange=e=>{
  if(Object.hasOwn(tactics,e.target.name)){
   stop();tactics[e.target.name]=e.target.value;
   live.events.push({kind:"tactics",minute,club:"jfl",outcome:"Tactics · "+tactics.mentality+" mentality, "+tactics.press+" press"});
   draw();
  }
 };
 dialog.onclick=e=>{
  const target=e.target.closest("button");if(!target)return;
  if(target.hasAttribute("data-step")){stop();play();draw()}
  if(target.hasAttribute("data-run")){
   if(timer)stop();
   else timer=setInterval(()=>{play();draw();if(minute===45){stop();draw()}},1400);
   draw();
  }
  if(target.hasAttribute("data-finish")){stop();while(!finished)play();draw()}
  if(target.hasAttribute("data-sub")){
   stop();
   const out=lines[own].find(row=>row.p.id===find("[name=out]").value);
   const incoming=bench.find(p=>p.id===find("[name=in]").value);
   if(out&&incoming)substitute(own,out,incoming);
   draw();
  }
  if(target.hasAttribute("data-live-report")&&report){dialog.close();careerOpenMatch(report)}
 };
 dialog.addEventListener("close",()=>{stop();if(finished)careerDecision(c);else toast("Match abandoned. Your career save is unchanged.");},{once:true});
 draw();
}

const careerTalkTopics={
 praise:["Praise recent form","I appreciate what you’ve been doing for the team."],
 standards:["Raise standards","I think you can give us more. Are you ready to push yourself?"],
 shooting:["Finishing plan","Let’s work on your finishing for the next four weeks."],
 defending:["Defensive plan","Let’s work on defensive positioning for the next four weeks."],
 fitness:["Conditioning plan","Let’s work on your conditioning for the next four weeks."],
 rest:["Recovery","Let’s ease off the workload and focus on recovery."]
};
function careerMood(p){
 if(p.morale>=82)return "Delighted";
 if(p.morale>=65)return "Positive";
 if(p.morale>=48)return "Settled";
 if(p.morale>=32)return "Frustrated";
 return "Unhappy";
}
function careerTalk(c,p,focus){
 if(c.ended||!Object.hasOwn(careerTalkTopics,focus))throw Error("This conversation is unavailable.");
 if(c.talks[p.id]&&c.talks[p.id]>=shiftDay(c.date,-6))throw Error("Give this player a week before another discussion.");
 const before=p.morale,sharpness=p.sharpness;
 const recent=c.latest?.box?.find(row=>row.id===p.id||row.club==="jfl"&&row.name===p.name);
 let reply,plan="";
 if(focus==="praise"){
  const positive=recent?recent.rating>=6.8||recent.g+recent.a>0:p.stats.g+p.stats.a>0||p.morale>=65;
  p.morale+=positive?6:-2;
  reply=positive?"Thanks, coach. It feels good to know you noticed. I’ll try to carry that into the next match.":"I appreciate it, but I don’t feel like I’ve earned that yet.";
 }else if(focus==="standards"){
  const positive=p.morale>=57&&p.fitness>=55&&!p.injury;
  p.morale+=positive?2:-6;
  if(positive)p.sharpness+=4;
  reply=positive?"I can handle that. Give me a chance to show you at training.":"That feels harsh right now. I need a bit of support before we talk about raising the bar.";
 }else if(focus==="rest"){
  const needed=p.fitness<86||p.injury>0;
  if(needed){
   p.restUntil=shiftDay(c.date,7);p.morale+=4;plan="Light training for 7 days";
   reply="That would help. I’ll take the next week easier and see how I feel.";
  }else{
   reply="I’m feeling fresh. I’d prefer to stick to the normal schedule.";
  }
 }else{
  const positive=p.morale>=46&&p.fitness>=52&&!p.injury;
  if(positive){
   p.focus={shooting:"attack",defending:"defence",fitness:"engine"}[focus];
   p.focusUntil=shiftDay(c.date,28);p.restUntil="";p.morale+=2;plan="Individual plan for 28 days";
   reply="I’m up for it. Let’s review how it’s going in a few weeks.";
  }else{
   p.morale-=2;
   reply="Can we get my fitness and confidence back first? I don’t want to add more work right now.";
  }
 }
 p.morale=careerBound(p.morale,15,100);p.sharpness=careerBound(p.sharpness,0,100);
 const effects=[["Morale",p.morale-before],["Sharpness",p.sharpness-sharpness]]
  .filter(([,delta])=>delta).map(([label,delta])=>label+" "+(delta>0?"+":"")+Math.round(delta));
 if(plan)effects.push(plan);
 c.talks[p.id]=c.date;
 p.conversations=[{date:c.date,topic:focus,reply,effect:effects.join(" · ")||"No change"},...(p.conversations||[])].slice(0,8);
 careerLog(c,"Spoke with "+p.name+" · "+careerTalkTopics[focus][0]+".","Squad");
}
function careerConversation(c,p){
 if(!p)return;
 const dialog=document.createElement("dialog");
 dialog.className="career-chat";
 dialog.setAttribute("aria-labelledby","career-chat-title");
 function draw(){
  const latest=c.latest?.box?.find(row=>row.id===p.id||row.club==="jfl"&&row.name===p.name);
  const next=c.talks[p.id]?shiftDay(c.talks[p.id],7):"";
  const available=!c.ended&&next<=c.date;
  const opening=p.injury?"I’m still recovering. I want to make sure I’m ready before I push it.":
   p.awayUntil>=c.date?"I’m away on international duty right now.":
   p.suspension?"I’m frustrated I can’t help the team while I’m suspended.":
   p.fitness<60?"I’m feeling the workload lately.":p.morale<48?"I haven’t been enjoying my football much lately.":
   latest?"I’ve been thinking about my performance in the last match.":"I’m ready to talk, coach.";
  dialog.innerHTML='<div class="replay-heading"><h2 id="career-chat-title">'+esc(p.name)+'</h2><button class="btn ghost" data-chat-close>Close</button></div>'+
   '<p>'+esc(p.pos)+' · '+careerMood(p)+' · Morale '+Math.round(p.morale)+'/100 · Fitness '+Math.round(p.fitness)+'/100 · Sharpness '+Math.round(p.sharpness)+'/100</p>'+
   '<p class="sub">'+(p.injury?p.injury+' days injured':p.suspension?p.suspension+' match ban':p.awayUntil>=c.date?'International duty':'Available')+
   (latest?' · Last match rating '+latest.rating.toFixed(1):'')+(p.restUntil>=c.date?' · Light training until '+esc(careerWhen(p.restUntil)):'')+
   (p.focusUntil>=c.date?' · Individual '+esc(p.focus)+' plan until '+esc(careerWhen(p.focusUntil)):'')+'</p>'+

function careerRouteAction(action,value){
 const c=careerState;
 if(action==="new-career"&&c.ended){careerRestart=true;return}
 if(action==="cancel-restart"){careerRestart=false;return}
 if(action==="read")c.unread=0;
 if(["report","team","archive","read"].indexOf(action)<0&&c.ended)throw Error("This career ended when the club went bankrupt.");
 if(action==="event-yes"||action==="event-no")careerBoardDecision(c,action==="event-yes");
 if(action==="next"){if(careerPending(c))return;if(c.round===c.fixtures.length)careerNextSeason(c);else careerRound(c);careerSession=""}
 if(action==="season"){
  if(c.boardEvent)throw Error("Resolve the pending board decision in the inbox before simulating the season.");
  while(!c.ended&&!careerPending(c)&&c.round<c.fixtures.length)careerRound(c);
  careerSession="";
 }
 if(action==="apply"){
  const next=careerTiers[c.level+1];if(next&&careerAdmission(c,next).every(([ok])=>ok)){c.requested=c.level+1;careerLog(c,"Application accepted for next season.")}
 }
 if(action==="lock-xi"){
  for(const row of careerBuildXI(c,c.players,c.formation,c.selection)){
   if(!c.selection[row.slot]&&!c.selection.includes(row.p.id))c.selection[row.slot]=row.p.id;
  }
  toast("Projected starters saved in open slots.");
 }
 if(action==="auto-xi")c.selection=Array(11).fill("");
 if(action==="remove-practice")c.training.splice(Number(value),1);
 if(action==="team"){careerTeamFilter=value;careerTab="league"}
 if(action==="archive"){careerHistory=value;careerTeamFilter="";careerTab="league"}
 if(action==="scout"){
  if(c.lastScout&&c.lastScout>shiftDay(c.date,-21))throw Error("Scouts can deliver a new shortlist every three weeks.");
  const cost=240+c.level*100;
  if(c.balance<cost)throw Error("The club cannot afford the scouting assignment.");
  const strength=careerTiers[c.level].rating;
  const tag="scout-"+c.date;
  const prospects=Array.from({length:5},(_,i)=>{
   const player=careerFictional(c,tag,i,strength+careerInt(c,0,3),c.year);
   player.fee=Math.max(25,(careerRating(player)-strength+5)*Math.max(100,c.level*190));
   return player;
  });
  c.market=[...prospects,...c.market].slice(0,24);
  c.lastScout=c.date;
  careerLedger(c,-cost,"Regional scouting assignment");
  careerLog(c,"Scouts added "+prospects.length+" prospects to the shortlist.","Recruitment");
 }
 if(action==="sign"){
  const p=c.market.find(p=>p.id===value);if(!p||c.players.length>=32||c.balance<p.fee)throw Error("Recruitment unavailable.");
  c.market=c.market.filter(x=>x.id!==p.id);p.club="jfl";p.morale=69;c.players.push(p);careerLedger(c,-p.fee,"Recruitment fee for "+p.name);careerLog(c,p.name+" joined JFL FC.");
 }
 if(action==="accept"||action==="decline"){
  const i=c.invites.find(x=>x.id===value&&x.status==="pending"),p=c.players.find(p=>p.id===i?.player);if(!i)return;
  if(!p){i.status="Withdrawn";return}
  if(i.until<c.date){i.status="Expired";return}
  i.status=action==="accept"?"Released":"Declined";
  if(action==="accept"){p.awayUntil=i.until;p.morale=Math.min(100,p.morale+5)}
  else p.morale=Math.max(15,p.morale-6);
 }
}
function careerSubmit(action,d,live=null){
 if(action==="start"){
  const season=seasonBy(d.season),start=season?.start||d.start,end=season?.end||d.end,days=(Date.parse(end)-Date.parse(start))/86400000;
  if(!Number.isFinite(days)||days<15||days>366)throw Error("Choose a season window between 15 and 366 days.");
  if(!loaded)throw Error("Wait until the league roster has loaded.");
  const difficulty=Object.hasOwn(careerDifficulties,d.difficulty)?d.difficulty:"standard";
  const matchMode=careerState?.matchMode;
  careerState=careerStart(start,end,difficulty,season);if(matchMode)careerState.matchMode=matchMode;careerRestart=false;careerTab="club";careerPlayerId="";
  careerSession="";careerHistory="";careerTeamFilter="";careerPlayerFilter="";return;
 }
 const c=careerState;
 if(action==="match-settings"&&["live","highlights","instant"].includes(d.mode)){c.matchMode=d.mode;return}
 if(c.ended)throw Error("This career has ended.");
 const p=c.players.find(p=>p.id===d.player);
 if(action==="kit")c.kit={home:safeColor(d.home),away:safeColor(d.away),trim:safeColor(d.trim),style:d.style};
 if(action==="tactics"){
  if(c.formation!==d.formation){
   const previous=careerShape[c.formation].map((pos,i)=>({pos,id:c.selection[i]})).filter(x=>x.id);
   const next=Array(11).fill("");
   careerShape[d.formation].forEach((pos,i)=>{
    const old=previous.findIndex(x=>x.pos===pos);
    if(old>=0)next[i]=previous.splice(old,1)[0].id;
   });
   for(const remaining of previous){
    const position=careerShape[d.formation].findIndex((pos,i)=>!next[i]&&POS[pos]===POS[remaining.pos]);
    const slot=position<0?next.indexOf(""):position;
    if(slot>=0)next[slot]=remaining.id;
   }
   c.selection=next;
   c.cohesion=Math.max(0,(c.cohesion||0)-5);
  }
  c.formation=d.formation;c.mentality=d.mentality;c.press=d.press;
 }
 if(action==="selection"){
  const chosen=careerShape[c.formation].map((_,i)=>d["slot"+i]);const picked=chosen.filter(Boolean);
  if(new Set(picked).size!==picked.length)throw Error("Assign each player to one starting position.");
  c.selection=chosen;
 }
 if(action==="practice"){
  const index=Number(d.index),s={day:Number(d.day),time:d.time,length:Number(d.length),focus:d.focus};
  if(c.training.some((r,i)=>i!==index&&r.day===s.day&&r.time===s.time))throw Error("A practice is already scheduled at that time.");
  if(index<0&&c.training.length<5)c.training.push(s);else if(index>=0&&index<c.training.length)c.training[index]=s;
  toast("Training schedule saved. Your starting XI is saved separately.");
 }
 if(action==="facility"){
  const level=Number(d.level),price=careerFacilities[level].cost;if(c.facility===level)return;
  if(c.balance<price)throw Error("The club cannot afford the setup cost.");
  c.facility=level;careerLedger(c,-price,"Facilities setup");
 }
 if(action==="coach")c.coach=Number(d.level);
 
 if(action==="friendly"){
  if(c.round>=c.fixtures.length||!d.date||d.date<c.date||careerFixtureDate(c)<=shiftDay(d.date,1))throw Error("Choose a free date before the next league fixture.");
  if(c.friendlies.some(r=>r.date===d.date))throw Error("A friendly has already been played on that date.");

  const opponent=c.clubs.find(x=>x.id===d.opponent&&x.id!=="jfl");if(!opponent)return;
  if(!live)careerWeek(c,d.date);if(c.ended)return;
  c.gameVenue=d.venue;
  const r=careerMatch(c,...(d.venue==="away"?[opponent.id,"jfl"]:["jfl",opponent.id]),true,live);
  c.friendlies.push(r);c.latest=r;careerSession=careerMatchKey(r);careerLedger(c,d.venue==="home"?60:-90,"Friendly match");
  careerLog(c,r.names[0]+" "+r.goals.join("–")+" "+r.names[1]+" · Friendly","Result");
  careerWeek(c,shiftDay(c.date,1));
 }
 if(action==="contract"&&p&&c.level>=5){
  const wage=Number(d.wage),min=Math.max(55,Math.round((careerRating(p)-42)*9+c.level*12)+(p.morale<45?45:0));
  const projected=c.players.reduce((a,x)=>a+x.wage,0)-p.wage+wage;
  if(wage<min)throw Error(p.name+" wants at least "+careerMoney(min)+" per week.");
  if(projected*4>c.balance)throw Error("The club needs four weeks of payroll in reserve.");
  p.wage=wage;p.until=c.year+Number(d.years)-1;careerLog(c,p.name+" signed through "+p.until+".");
 }
 if(action==="depart"&&p){
  if(c.players.length<=11)throw Error("Bring in a replacement before reducing the squad further.");
  if(d.method==="release"&&p.wage&&Math.max(0,p.wage*4)>c.balance)throw Error("The club cannot afford the contract settlement.");
  if(d.method==="release"&&p.wage)careerLedger(c,-p.wage*4,"Contract settlement for "+p.name);
  careerTransferOut(c,p,d.method==="release"?"was released":"left for another club",d.method==="transfer"&&c.level>=5?Math.round(careerRating(p)*p.wage*.4):0);
 }
}
const careerTablePreferences=new Map();
const careerCollator=new Intl.Collator(undefined,{numeric:true,sensitivity:"base"});
function careerFilterValue(cell){
 return cell.querySelector("time")?.dateTime||cell.textContent.trim();
}
function careerMatchesFilter(value,query){
 const comparison=query.match(/^(>=|<=|>|<|=)\s*(.+)$/);
 if(!comparison)return nk(value).includes(nk(query));
 const [,operator,target]=comparison;
 const numeric=text=>/^[$+−-]?\d[\d,]*(?:\.\d+)?[%′]?$/.test(text);
 const number=text=>Number(text.replace(/[$,%′]/g,"").replace("−","-"));
 if(numeric(value)&&numeric(target)){
  const delta=number(value)-number(target);
  return operator==="="?delta===0:operator===">"?delta>0:operator==="<"?delta<0:operator===">="?delta>=0:delta<=0;
 }
 if(operator==="=")return nk(value)===nk(target);
 if(!/^\d{4}-\d{2}-\d{2}$/.test(value)||!/^\d{4}-\d{2}-\d{2}$/.test(target))return false;
 return operator===">"?value>target:operator==="<"?value<target:operator===">="?value>=target:value<=target;
}
function bindCareerTables(view){
 view.querySelectorAll(".career-section table.sport-table").forEach((table,index)=>{
  const key=careerOwner+"|"+careerTab+"|"+index+"|"+table.tHead.rows[0].textContent;
  const state=careerTablePreferences.get(key)||{open:false,queries:[],sort:-1,dir:1};
  careerTablePreferences.set(key,state);
  const header=table.tHead.rows[0],body=table.tBodies[0],rows=Array.from(body.rows);
  const toolbar=document.createElement("div");
  toolbar.className="career-table-toolbar";
  toolbar.innerHTML='<button type="button" class="btn ghost">Column filters</button><button type="button" class="btn ghost">Clear filters</button><span role="status"></span>';
  table.closest(".table-scroll").before(toolbar);
  const [toggle,clear]=toolbar.querySelectorAll("button"),status=toolbar.querySelector("span");
  const help=document.createElement("p");
  help.className="hint";
  help.textContent="Combine filters across columns. Use = for exact matches or comparisons like >=70 and >=2026-09-01.";
  toolbar.after(help);
  const filters=table.tHead.insertRow(),inputs=[];
  const headings=Array.from(header.cells);
  headings.forEach((th,i)=>{
   const title=th.textContent.trim()||"Actions";
   const sort=document.createElement("button");
   sort.type="button";sort.className="career-sort";sort.textContent=title;
   sort.onclick=()=>{
    if(state.sort===i)state.dir=-state.dir;
    else{
     const values=rows.map(row=>careerFilterValue(row.cells[i])).filter(value=>value&&value!=="—");
     const isDate=rows.some(row=>Boolean(row.cells[i].querySelector("time")));
     const isNumeric=values.some(value=>/^[$+−-]?\d[\d,]*(?:\.\d+)?[%′]?$/.test(value));
     state.dir=isDate||isNumeric?-1:1;
    }
    state.sort=i;apply();
   };
   th.replaceChildren(sort);
   const box=document.createElement("input");
   box.type="search";box.value=state.queries[i]||"";
   box.placeholder=title==="Date"?"YYYY-MM-DD":"Filter";
   box.setAttribute("aria-label","Filter "+title);
   box.addEventListener("input",()=>{state.queries[i]=box.value;apply()});
   filters.insertCell().append(box);inputs.push(box);
  });
  function apply(){
   headings.forEach((th,i)=>{
    if(i===state.sort)th.setAttribute("aria-sort",state.dir>0?"ascending":"descending");
    else th.removeAttribute("aria-sort");
   });
   const index=state.sort;
   const sorted=index<0?rows:[...rows].sort((a,b)=>{
    const x=careerFilterValue(a.cells[index]),y=careerFilterValue(b.cells[index]);
    const asNumber=value=>Number(value.replace(/[$,%′]/g,"").replace("−","-"));
    const nx=asNumber(x),ny=asNumber(y);
    return state.dir*(Number.isFinite(nx)&&Number.isFinite(ny)?nx-ny:careerCollator.compare(x,y));
   });
   let visible=0;
   for(const row of sorted){
    row.hidden=state.queries.some((raw,i)=>{
     const query=raw.trim();
     return query&&!careerMatchesFilter(careerFilterValue(row.cells[i]),query)&&
      (row.cells[i].textContent.trim()===careerFilterValue(row.cells[i])||!careerMatchesFilter(row.cells[i].textContent.trim(),query));
    });
    if(!row.hidden)visible++;
   }
   if(index!==state.appliedSort||state.dir!==state.appliedDir){
    body.append(...sorted);
    state.appliedSort=index;state.appliedDir=state.dir;
   }
   status.textContent=visible+" of "+rows.length+" rows";
   clear.hidden=!state.queries.some(query=>query.trim());
  }
  function show(){
   filters.hidden=!state.open;help.hidden=!state.open;toggle.setAttribute("aria-expanded",String(state.open));
  }
  toggle.onclick=()=>{state.open=!state.open;show();if(state.open)inputs[0]?.focus()};
  clear.onclick=()=>{state.queries=[];inputs.forEach(box=>box.value="");apply();toggle.focus()};
  state.appliedSort=undefined;show();apply();
 });
}
function bindCareer(v){
 bindCareerTables(v);
 if(careerState?.ended&&!careerRestart){
  v.querySelectorAll("[data-career-form]:not([data-career-form=match-settings]) :is(button,select,input)").forEach(el=>el.disabled=true);
  const readable=new Set(["new-career","report","replay","team","archive","read","conversation","focus-slot","player-profile","player-back","fixtures-back","preview"]);
  v.querySelectorAll("[data-career]").forEach(el=>{if(!readable.has(el.dataset.career))el.disabled=true});
 }
 v.onclick=e=>{
  const x=e.target.closest("[data-career]");if(!x)return;
  try{
   const action=x.dataset.career,previous=careerState?.latest;
   if(action==="end-career"){
    careerEndPrompt(careerState);return;
   }
   if(action==="decision"||(["next","season"].includes(action)&&careerPending(careerState))){
    careerDecision(careerState);return;
   }
   if(action==="player-profile"||action==="player-back"){
    if(action==="player-profile"){careerPlayerFrom=careerTab==="player"?careerPlayerFrom:careerTab;careerPlayerId=x.dataset.value;careerTab="player"}
    else careerTab=careerPlayerFrom;
    render();v.querySelector(".manager-header")?.scrollIntoView({block:"start"});return;
   }
   if(action==="practice-map"){careerPractice(careerState,Number(x.dataset.value));return}
   if(action==="conversation"){
    careerConversation(careerState,careerState.players.find(p=>p.id===x.dataset.value));return;
   }
   if(action==="focus-slot"){
    e.preventDefault();careerAssignSlot(careerState,Number(x.dataset.value));return;
   }
   if(action==="fixtures-back"){careerTab="fixtures";render();return}
   if(action==="preview"){
    const i=Number(x.dataset.value),pair=careerState.fixtures[i]?.find(ids=>ids.includes("jfl"));
    if(pair)careerModal("Fixture preview",'<p>'+esc(pair.map(id=>careerClub(careerState,id)).join(" vs "))+'</p><p>'+esc(careerWhen(careerFixtureDate(careerState,i)))+'</p>');
    return;
   }
   if(action==="report"){
    const report=careerMatchArchive(careerState).find(r=>careerMatchKey(r)===x.dataset.value);
    if(report)careerOpenMatch(report);
    return;
   }
   if(action==="next"&&(careerState.matchMode||"live")==="live"&&careerState.round<careerState.fixtures.length){careerLiveMatch();return}
   if(action==="replay"){
    const report=careerMatchArchive(careerState).find(r=>careerMatchKey(r)===x.dataset.value);
    if(report)careerShowMatch(report,false);
    return;
   }
   careerRouteAction(action,x.dataset.value);careerSave();render();
   if((action==="next"||action==="season")&&careerState?.latest&&careerState.latest!==previous){
    if(careerState.matchMode==="instant"){careerOpenMatch(careerState.latest);careerDecision(careerState)}
    else careerShowMatch(careerState.latest,action==="season");
   }else if(careerState?.ended&&(action==="next"||action==="season"))toast("Career ended: the club ran out of cash.");
  }catch(error){toast(error.message)}
 };
 v.onsubmit=e=>{
  const f=e.target,kind=f.dataset.careerForm;if(!kind)return;e.preventDefault();
  try{
   const previous=careerState?.latest;
   const data=Object.fromEntries(new FormData(f));
   if(kind==="friendly"&&(careerState.matchMode||"live")==="live"){careerLiveMatch(data);return}
   careerSubmit(kind,data);careerSave();render();
   if(kind==="friendly"&&careerState.latest!==previous){
    if(careerState.matchMode==="instant")careerOpenMatch(careerState.latest);
    else careerShowMatch(careerState.latest,false);
   }
  }catch(error){toast(error.message)}
 };
 v.onchange=e=>{

  if(name==="season"&&e.target.form?.dataset.careerForm==="start"){
   const s=seasonBy(value);if(s){e.target.form.elements.start.value=s.start;e.target.form.elements.end.value=s.end}
  }
  if(e.target.form?.dataset.careerForm==="selection"&&name.startsWith("slot")){
   if(careerState.ended)return;

   careerAssign(careerState,slot,value);

  }

 };
}
