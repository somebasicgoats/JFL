name: Publish JFL with Discord previews
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: jfl-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        id: pages
      - name: Build site and preview pages
        env:
          JFL_PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          python3 tools/build-match-links.py
          mkdir -p public
          cp index.html public/
          cp -R matches public/
          if [ -d vendor ]; then cp -R vendor public/; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/deploy-pages@v4
        id: deployment
